name: LAN运行数据与配置分离
on:
  push:
    branches: [ master ]
permissions:
  contents: write
jobs:
  split:
    if: github.event.head_commit.message != '完成LAN运行数据与配置分离'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 调整运行数据存储
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          scripts = [
              root / 'trunk/user/lan_autodiscover/lan_autodiscover.sh',
              root / 'trunk/user/lan_autodiscover/lan_discovery_supervisor.sh',
          ]

          for path in scripts:
              s = path.read_text(encoding='utf-8')
              s = s.replace('DEVICE_DB=/etc/storage/lan_discovery_devices.db', 'DEVICE_DB=/tmp/lan_discovery_devices.txt')
              s = s.replace('LOG_FILE=/etc/storage/lan_discovery.log', 'LOG_FILE=/tmp/lan_discovery.log')
              s = s.replace('mkdir -p /etc/storage\ntouch "$DEVICE_DB" "$LOG_FILE"', 'mkdir -p /tmp\ntouch "$DEVICE_DB" "$LOG_FILE"\nRUNTIME_DIR=/tmp/lan_discovery_runtime\nmkdir -p "$RUNTIME_DIR"')
              if 'runtime_set() {' not in s:
                  marker = 'nv() { nvram get "$1" 2>/dev/null; }\n'
                  helper = '''nv() { nvram get "$1" 2>/dev/null; }\n# 运行时状态只保存在/tmp，不写入持久NVRAM。\nruntime_set() {\n    item="$1"\n    key="${item%%=*}"\n    value="${item#*=}"\n    tmp="${RUNTIME_DIR}/.${key}.tmp"\n    printf '%s' "$value" > "$tmp" && mv -f "$tmp" "${RUNTIME_DIR}/${key}"\n}\n'''
                  s = s.replace(marker, helper, 1)
              s = re.sub(r'\bnvram set (lan_discovery_status_[A-Za-z0-9_]+)=', r'runtime_set \1=', s)
              s = re.sub(r'\bnvram set (lan_discovery_(?:log|devices|interfaces))=', r'runtime_set \1=', s)
              # 设备列表不再写NVRAM，页面直接读取/tmp列表。
              s = re.sub(r'^\s*runtime_set lan_discovery_devices=.*$', '', s, flags=re.M)
              # 删除旧的运行时初始化，仅保留配置参数默认值。
              s = re.sub(r'^\s*\[ -n "\$\(nv lan_discovery_status_[^\n]+$', '', s, flags=re.M)
              path.write_text(s, encoding='utf-8')

          # WebUI原有nvram_get_x调用保持不变，但运行时字段由/tmp覆盖读取。
          webex = root / 'trunk/user/httpd/web_ex.c'
          s = webex.read_text(encoding='utf-8')
          old = '''\tcn = nvram_safe_get(name);\n\tfor (c = cn; *c; c++) {\n\t\tif (*c < 0 || (*c >= 0x20 && *c != '\"' && *c != '&' && *c != '<' && *c != '>'))\n\t\t\tret += fprintf(wp, \"%c\", *c);\n\t\telse\n\t\t\tret += fprintf(wp, \"&#%d;\", *c);\n\t}\n'''
          new = '''\t/* LAN监听运行状态全部来自/tmp；只有配置项继续读取NVRAM。 */\n\tif (strncmp(name, \"lan_discovery_status_\", 21) == 0 ||\n\t    strcmp(name, \"lan_discovery_log\") == 0 ||\n\t    strcmp(name, \"lan_discovery_devices\") == 0 ||\n\t    strcmp(name, \"lan_discovery_interfaces\") == 0) {\n\t\tchar path[128];\n\t\tFILE *fp;\n\t\tint ch;\n\t\tsnprintf(path, sizeof(path), \"/tmp/lan_discovery_runtime/%s\", name);\n\t\tfp = fopen(path, \"r\");\n\t\tif (fp) {\n\t\t\twhile ((ch = fgetc(fp)) != EOF) {\n\t\t\t\tif (ch < 0 || (ch >= 0x20 && ch != '\"' && ch != '&' && ch != '<' && ch != '>'))\n\t\t\t\t\tret += fprintf(wp, \"%c\", ch);\n\t\t\t\telse\n\t\t\t\t\tret += fprintf(wp, \"&#%d;\", ch);\n\t\t\t}\n\t\t\tfclose(fp);\n\t\t\tfflush(wp);\n\t\t\treturn ret;\n\t\t}\n\t\treturn 0;\n\t}\n\n\tcn = nvram_safe_get(name);\n\tfor (c = cn; *c; c++) {\n\t\tif (*c < 0 || (*c >= 0x20 && *c != '\"' && *c != '&' && *c != '<' && *c != '>'))\n\t\t\tret += fprintf(wp, \"%c\", *c);\n\t\telse\n\t\t\tret += fprintf(wp, \"&#%d;\", *c);\n\t}\n'''
          if old not in s:
              raise SystemExit('未找到nvram_get_x目标代码')
          s = s.replace(old, new, 1)
          webex.write_text(s, encoding='utf-8')
          PY
          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh
          sh -n trunk/user/lan_autodiscover/lan_discovery_supervisor.sh
          grep -q 'LAN监听运行状态全部来自/tmp' trunk/user/httpd/web_ex.c
          grep -q 'DEVICE_DB=/tmp/lan_discovery_devices.txt' trunk/user/lan_autodiscover/lan_autodiscover.sh
          git diff --check
      - name: 提交正式源码
        shell: bash
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add trunk/user/lan_autodiscover/lan_autodiscover.sh trunk/user/lan_autodiscover/lan_discovery_supervisor.sh trunk/user/httpd/web_ex.c .github/workflows/_lan_runtime_split.yml
          git commit -m '完成LAN运行数据与配置分离'
          git rm .github/workflows/_lan_runtime_split.yml
          git commit --amend --no-edit
          git push
