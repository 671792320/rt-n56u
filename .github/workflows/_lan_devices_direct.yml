name: LAN设备列表直接读取
on:
  push:
    branches: [ master ]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != '修复LAN设备列表直接读取'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 修改LAN设备列表调用
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          asp = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Data.asp')
          s = asp.read_text(encoding='utf-8')
          old = '<% nvram_get_x("", "lan_discovery_devices"); %>'
          new = '<% lan_discovery_devices(); %>'
          if old not in s:
              raise SystemExit('未找到设备列表调用')
          s = s.replace(old, new, 1)
          asp.write_text(s, encoding='utf-8')

          webex = Path('trunk/user/httpd/web_ex.c')
          s = webex.read_text(encoding='utf-8')
          marker = 'struct ej_handler ej_handlers[] =\n{\n'
          if 'static int\nej_lan_discovery_devices' not in s:
              func = '''static int\nej_lan_discovery_devices(int eid, webs_t wp, int argc, char **argv)\n{\n\tFILE *fp;\n\tint ch;\n\n\t/* 已发现设备列表是运行时数据，唯一来源为/tmp文本文件。 */\n\tfp = fopen("/tmp/lan_discovery_devices.txt", "r");\n\tif (!fp)\n\t\treturn 0;\n\n\twhile ((ch = fgetc(fp)) != EOF)\n\t\tfputc(ch, wp);\n\n\tfclose(fp);\n\tfflush(wp);\n\treturn 0;\n}\n\n'''
              if marker not in s:
                  raise SystemExit('未找到EJ处理器表')
              s = s.replace(marker, func + marker, 1)
          entry = '\t{ "lan_discovery_devices", ej_lan_discovery_devices},\n'
          if entry not in s:
              anchor = '\t{ "lan_discovery_data", ej_lan_discovery_data},\n'
              if anchor in s:
                  s = s.replace(anchor, anchor + entry, 1)
              else:
                  anchor = '\t{ "json_system_status", ej_system_status_hook},\n'
                  if anchor not in s:
                      raise SystemExit('未找到EJ处理器插入位置')
                  s = s.replace(anchor, anchor + entry, 1)
          webex.write_text(s, encoding='utf-8')
          PY
          grep -q 'lan_discovery_devices();' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Data.asp
          grep -q 'ej_lan_discovery_devices' trunk/user/httpd/web_ex.c
          git diff --check
      - name: 提交正式源码
        shell: bash
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Data.asp trunk/user/httpd/web_ex.c .github/workflows/_lan_devices_direct.yml
          git commit -m '修复LAN设备列表直接读取'
          git rm .github/workflows/_lan_devices_direct.yml
          git commit --amend --no-edit
          git push
