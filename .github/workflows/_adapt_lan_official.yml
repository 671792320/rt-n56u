name: 临时适配LAN监听官方WebUI机制

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出主线
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: 按官方变量表适配LAN监听参数
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path('trunk/user/httpd/variables.c')
          s = p.read_text(encoding='utf-8')
          anchor = '\t\t\t{"lan_gateway", "", NULL, EVM_RESTART_LAN},\n'
          insert = anchor + '''\t\t\t{"lan_discovery_enable", "", NULL, FALSE},\n\t\t\t{"lan_discovery_ifname", "", NULL, FALSE},\n\t\t\t{"lan_discovery_dhcp_enable", "", NULL, FALSE},\n\t\t\t{"lan_discovery_dhcp_timeout", "", NULL, FALSE},\n\t\t\t{"lan_discovery_discover_enable", "", NULL, FALSE},\n\t\t\t{"lan_discovery_cycle", "", NULL, FALSE},\n\t\t\t{"lan_discovery_onvif", "", NULL, FALSE},\n\t\t\t{"lan_discovery_onvif_port", "", NULL, FALSE},\n\t\t\t{"lan_discovery_ssdp", "", NULL, FALSE},\n\t\t\t{"lan_discovery_ssdp_port", "", NULL, FALSE},\n\t\t\t{"lan_discovery_hik", "", NULL, FALSE},\n\t\t\t{"lan_discovery_hik_port", "", NULL, FALSE},\n\t\t\t{"lan_discovery_dahua", "", NULL, FALSE},\n\t\t\t{"lan_discovery_dahua_port", "", NULL, FALSE},\n\t\t\t{"lan_discovery_raw", "", NULL, FALSE},\n\t\t\t{"lan_discovery_custom", "", NULL, FALSE},\n\t\t\t{"lan_discovery_log", "", NULL, FALSE},\n'''
          if '"lan_discovery_enable"' not in s:
              if anchor not in s:
                  raise SystemExit('LANHostConfig insertion anchor not found')
              s = s.replace(anchor, insert, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('LAN discovery variables already registered')
          PY

      - name: 恢复脚本使用标准nvram set key=value
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('trunk/user/lan_autodiscover/lan_autodiscover.sh'),
              Path('trunk/user/lan_autodiscover/lan_discovery_supervisor.sh'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              s = s.replace('''# Q7统一通过nv_set写入NVRAM，确保实时状态能够被WebUI正确读取。\nNVRAM_BIN="$(command -v nvram)"\nnv_set() {\n    "$NVRAM_BIN" set "$1=$2"\n}\n\n''', '')
              s = re.sub(r'\bnv_set\s+([A-Za-z0-9_]+)\s+(.+)$', r'nvram set \1=\2', s, flags=re.MULTILINE)
              s = re.sub(r'\bnvram\s+set\s+([A-Za-z0-9_]+)\s+(.+)$', r'nvram set \1=\2', s, flags=re.MULTILINE)
              p.write_text(s, encoding='utf-8')
          PY

      - name: 验证官方WebUI结构和参数链
        shell: bash
        run: |
          set -e
          grep -n 'variables_LANHostConfig\[\]' trunk/user/httpd/variables.c
          grep -n '"lan_discovery_enable"' trunk/user/httpd/variables.c
          grep -n '"lan_discovery_dhcp_enable"' trunk/user/httpd/variables.c
          grep -n '"lan_discovery_discover_enable"' trunk/user/httpd/variables.c
          grep -n 'sid_list" value="LANHostConfig;"' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -n 'name="lan_discovery_enable"' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -n 'id="lan_discovery_enable_0"' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -n 'id="lan_discovery_enable_1"' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -n "init_itoggle('lan_discovery_enable')" trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          ! grep -R -n -E 'nvram set [A-Za-z0-9_]+[[:space:]]+' trunk/user/lan_autodiscover/lan_autodiscover.sh trunk/user/lan_autodiscover/lan_discovery_supervisor.sh
          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh
          sh -n trunk/user/lan_autodiscover/lan_discovery_supervisor.sh
          git diff --check

      - name: 提交正式源码并清理临时工作流
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_adapt_lan_official.yml
          git add trunk/user/httpd/variables.c \
                  trunk/user/lan_autodiscover/lan_autodiscover.sh \
                  trunk/user/lan_autodiscover/lan_discovery_supervisor.sh \
                  .github/workflows/_adapt_lan_official.yml
          git diff --cached --check
          git commit -m "按Padavan官方机制适配LAN监听WebUI开关"
          git push origin master
