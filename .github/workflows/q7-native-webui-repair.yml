name: Q7 Native WebUI Repair

on:
  push:
    branches: [master]
    paths:
      - 'trunk/user/httpd/httpd.c'
      - 'trunk/user/httpd/lan_discovery_vars.c'
      - 'trunk/user/httpd/.q7_webui_repair_trigger'
      - 'trunk/user/lan_autodiscover/lan_network_manager.sh'
      - 'trunk/user/lan_autodiscover/lan_autodiscover.sh'
      - 'trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Restore Padavan native WebUI save path and make miss rounds configurable
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          # 恢复Padavan原生HTTP登录会话校验。
          p = Path('trunk/user/httpd/httpd.c')
          s = p.read_text(encoding='utf-8')
          broken = '''\tif (is_uaddr_localhost(ip_now))
\t\treturn 1;

\treturn 2;
}'''
          native = '''\tif (is_uaddr_localhost(ip_now))
\t\treturn 1;

\tif (login_ip.len == 0)
\t\treturn 2;

\tif (is_uaddr_equal(&login_ip, ip_now))
\t\treturn 3;

\tif ((unsigned long)(uptime() - login_timestamp) > LOGIN_TIMEOUT) {
\t\treset_login_data();
\t\treturn 2;
\t}

\treturn 0;
}'''
          if broken in s:
              s = s.replace(broken, native, 1)
              p.write_text(s, encoding='utf-8')

          # 丢失轮数加入Padavan正常NVRAM变量保存路径。
          p = Path('trunk/user/httpd/lan_discovery_vars.c')
          s = p.read_text(encoding='utf-8')
          marker = '    {"lan_discovery_cycle", "", NULL, FALSE},\n'
          if '"lan_discovery_miss_limit"' not in s:
              if marker not in s:
                  raise SystemExit('lan_discovery_vars.c插入点不存在')
              s = s.replace(marker, marker + '    {"lan_discovery_miss_limit", "", NULL, FALSE},\n', 1)
              p.write_text(s, encoding='utf-8')

          # 网络管理器根据用户配置决定连续丢失多少完整扫描轮次后清理。
          p = Path('trunk/user/lan_autodiscover/lan_network_manager.sh')
          s = p.read_text(encoding='utf-8')
          old = 'MISS_LIMIT=3\n'
          new = '''MISS_LIMIT="$(nvram get lan_discovery_miss_limit 2>/dev/null)"
case "$MISS_LIMIT" in ''|*[!0-9]*) MISS_LIMIT=3;; esac
[ "$MISS_LIMIT" -ge 1 ] 2>/dev/null || MISS_LIMIT=1
[ "$MISS_LIMIT" -le 20 ] 2>/dev/null || MISS_LIMIT=20
'''
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          # 建立默认值，仍由Padavan NVRAM保存。
          p = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = p.read_text(encoding='utf-8')
          marker = '[ -n "$(nv lan_discovery_cycle)" ] || nvram set lan_discovery_cycle=10\n'
          if 'lan_discovery_miss_limit' not in s:
              if marker not in s:
                  raise SystemExit('lan_autodiscover.sh默认值插入点不存在')
              s = s.replace(marker, marker + '[ -n "$(nv lan_discovery_miss_limit)" ] || nvram set lan_discovery_miss_limit=3\n', 1)
              p.write_text(s, encoding='utf-8')

          # 在扫描周期下面增加可自定义轮数，使用原生表单/NVRAM方式保存。
          p = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          s = p.read_text(encoding='utf-8')
          marker = '<tr><th>设备发现周期</th><td><input class="mini" name="lan_discovery_cycle" onkeypress="return is_number(this,event);" value="<% nvram_get_x(\"\", \"lan_discovery_cycle\"); %>"> 秒　<span class="muted">两轮主动探测开始之间的目标周期</span></td></tr>'
          row = marker + '\n<tr><th>目标网段丢失轮数</th><td><input class="mini" name="lan_discovery_miss_limit" onkeypress="return is_number(this,event);" value="<% nvram_get_x(\"\", \"lan_discovery_miss_limit\"); %>"> 轮　<span class="muted">连续完整扫描未发现目标网段达到此轮数后才清理SNAT和临时IP，默认3轮</span></td></tr>'
          if 'name="lan_discovery_miss_limit"' not in s:
              if marker not in s:
                  raise SystemExit('Advanced_LANDiscover_Content.asp扫描周期插入点不存在')
              s = s.replace(marker, row, 1)
              p.write_text(s, encoding='utf-8')

          # 无线页面保持Padavan原生SSID保存流程，仅校验不改动。
          w = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_Wireless_Content.asp').read_text(encoding='utf-8')
          for item in (
              'name="wl_ssid2"',
              'document.form.wl_ssid.value = decodeURIComponent(document.form.wl_ssid2.value);',
              'document.form.action_mode.value = " Apply ";',
              'document.form.submit();',
          ):
              if item not in w:
                  raise SystemExit('Padavan无线SSID原生保存代码缺失：' + item)

          trigger = Path('trunk/user/httpd/.q7_webui_repair_trigger')
          if trigger.exists():
              trigger.unlink()
          PY

          sh -n trunk/user/lan_autodiscover/lan_network_manager.sh
          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'if (login_ip.len == 0)' trunk/user/httpd/httpd.c
          grep -q 'is_uaddr_equal(&login_ip, ip_now)' trunk/user/httpd/httpd.c
          grep -q 'lan_discovery_miss_limit' trunk/user/httpd/lan_discovery_vars.c
          grep -q 'lan_discovery_miss_limit' trunk/user/lan_autodiscover/lan_network_manager.sh
          grep -q 'name="lan_discovery_miss_limit"' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trunk/user/httpd/httpd.c \
                  trunk/user/httpd/lan_discovery_vars.c \
                  trunk/user/lan_autodiscover/lan_network_manager.sh \
                  trunk/user/lan_autodiscover/lan_autodiscover.sh \
                  trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp \
                  trunk/user/httpd/.q7_webui_repair_trigger
          if ! git diff --cached --quiet; then
            git commit -m 'Q7：恢复Padavan原生WebUI保存链路并支持自定义SNAT丢失轮数'
            git push origin HEAD:master
          fi
