name: Q7 discovery settings direct edit

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  edit:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 直接修改源码
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')

          p = root / 'trunk/user/lan_autodiscover/lan_autodiscover.sh'
          s = p.read_text(encoding='utf-8')
          old = '''    probe_timeout=5\n    [ "$discover_cycle" -lt "$probe_timeout" ] 2>/dev/null && probe_timeout="$discover_cycle"\n    [ "$probe_timeout" -ge 1 ] 2>/dev/null || probe_timeout=1\n'''
          new = '''    # 响应等待与发现周期独立配置，默认10秒，允许1～30秒。\n    probe_timeout="$(cfg lan_discovery_probe_timeout 10)"\n    case "$probe_timeout" in ''|*[!0-9]*) probe_timeout=10;; esac\n    [ "$probe_timeout" -ge 1 ] 2>/dev/null || probe_timeout=1\n    [ "$probe_timeout" -le 30 ] 2>/dev/null || probe_timeout=30\n'''
          if old not in s:
              raise SystemExit('未找到响应等待旧逻辑')
          s = s.replace(old, new, 1)
          old = '''[ -n "$(nv lan_discovery_cycle)" ] || nvram set lan_discovery_cycle=10\n[ -n "$(nv lan_discovery_miss_limit)" ] || nvram set lan_discovery_miss_limit=3\n'''
          new = '''[ -n "$(nv lan_discovery_cycle)" ] || nvram set lan_discovery_cycle=10\n[ -n "$(nv lan_discovery_probe_timeout)" ] || nvram set lan_discovery_probe_timeout=10\n[ -n "$(nv lan_discovery_miss_limit)" ] || nvram set lan_discovery_miss_limit=3\n'''
          if old not in s:
              raise SystemExit('未找到LAN发现默认参数')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = root / 'trunk/user/lan_autodiscover/lan_network_manager.sh'
          s = p.read_text(encoding='utf-8')
          old = '''MISS_LIMIT="$(nvram get lan_discovery_miss_limit 2>/dev/null)"\ncase "$MISS_LIMIT" in ''|*[!0-9]*) MISS_LIMIT=3;; esac\n[ "$MISS_LIMIT" -ge 1 ] 2>/dev/null || MISS_LIMIT=1\n[ "$MISS_LIMIT" -le 20 ] 2>/dev/null || MISS_LIMIT=20\n'''
          new = '''miss_limit_current() {\n    miss_limit="$(nvram get lan_discovery_miss_limit 2>/dev/null)"\n    case "$miss_limit" in ''|*[!0-9]*) miss_limit=3;; esac\n    [ "$miss_limit" -ge 1 ] 2>/dev/null || miss_limit=1\n    [ "$miss_limit" -le 20 ] 2>/dev/null || miss_limit=20\n    printf '%s' "$miss_limit"\n}\n'''
          if old not in s:
              raise SystemExit('未找到丢失轮数旧逻辑')
          s = s.replace(old, new, 1)
          old = '''process_completed_cycle() {\n    localnet="$1"\n    marker="$2"\n\n    collect_cycle_targets "$localnet"\n'''
          new = '''process_completed_cycle() {\n    localnet="$1"\n    marker="$2"\n    miss_limit="$(miss_limit_current)"\n\n    collect_cycle_targets "$localnet"\n'''
          if old not in s:
              raise SystemExit('未找到完整扫描轮次处理函数')
          s = s.replace(old, new, 1)
          s = s.replace('"$miss_count" -ge "$MISS_LIMIT"', '"$miss_count" -ge "$miss_limit"')
          s = s.replace('连续丢失=${miss_count}/${MISS_LIMIT}轮', '连续丢失=${miss_count}/${miss_limit}轮')
          s = s.replace('连续${MISS_LIMIT}个完整扫描轮次未发现才清理', '连续${miss_limit}个完整扫描轮次未发现才清理')
          p.write_text(s, encoding='utf-8')

          p = root / 'trunk/user/httpd/lan_discovery_vars.c'
          s = p.read_text(encoding='utf-8')
          old = '    {"lan_discovery_cycle", "", NULL, FALSE},\n'
          new = old + '    {"lan_discovery_probe_timeout", "", NULL, FALSE},\n'
          if old not in s:
              raise SystemExit('未找到WebUI变量表中的发现周期')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = root / 'trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp'
          s = p.read_text(encoding='utf-8')
          old = '<tr><th>设备发现周期</th><td><input class="mini" name="lan_discovery_cycle" onkeypress="return is_number(this,event);" value="<% nvram_get_x("", "lan_discovery_cycle"); %>"> 秒　<span class="muted">两轮主动探测开始之间的目标周期</span></td></tr>\n'
          new = old + '<tr><th>响应等待时间</th><td><input class="mini" name="lan_discovery_probe_timeout" onkeypress="return is_number(this,event);" value="<% nvram_get_x("", "lan_discovery_probe_timeout"); %>"> 秒　<span class="muted">每轮协议主动探测等待设备响应的最长时间，默认10秒，范围1～30秒</span></td></tr>\n'
          if old not in s:
              raise SystemExit('未找到设备发现周期WebUI行')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 完成源码直改后删除本次一次性工作流，不留下补丁层。
          wf = root / '.github/workflows/q7-discovery-settings-direct-edit.yml'
          wf.unlink()
      - name: 提交源码修改
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trunk/user/lan_autodiscover/lan_autodiscover.sh \
                  trunk/user/lan_autodiscover/lan_network_manager.sh \
                  trunk/user/httpd/lan_discovery_vars.c \
                  trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp \
                  .github/workflows/q7-discovery-settings-direct-edit.yml
          git diff --cached --check
          git commit -m "Q7：响应等待可调并支持运行中调整丢失轮数 [skip ci]"
          git push origin HEAD:master
