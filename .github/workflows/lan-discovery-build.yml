name: Q7 LAN discovery build

on:
  push:
    branches: [lan-discovery-config]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q7-lan-discovery-build
  cancel-in-progress: true

jobs:
  build:
    name: ZTE_Q7 LAN discovery
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: lan-discovery-config
          fetch-depth: 1

      - name: Apply LAN discovery WebUI and custom UDP probes
        run: |
          set -e
          python3 tools/lan_webui_patch.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          state = Path('trunk/user/www/n56u_ribbon_fixed/state.js')
          s = state.read_text()
          # Register the item immediately after the real L1 arrays are initialized.
          if 'lan_discovery_menu_index = menuL1_title.length;' not in s:
              pat = r'(menuL1_icon\s*=\s*new Array\([^;]+\);)'
              m = re.search(pat, s, re.S)
              if not m:
                  raise SystemExit('menuL1 arrays not found')
              inject = r'''\n\n/* Q7 LAN discovery: dedicated first-level menu item. */\nvar lan_discovery_menu_index = -1;\nfor (var _ldi = 1; _ldi < menuL1_title.length; _ldi++) {\n    if (menuL1_link[_ldi] == "Advanced_LANDiscover_Content.asp") {\n        lan_discovery_menu_index = _ldi;\n        break;\n    }\n}\nif (lan_discovery_menu_index < 0) {\n    lan_discovery_menu_index = menuL1_title.length;\n    menuL1_title.push("LAN自动发现");\n    menuL1_link.push("Advanced_LANDiscover_Content.asp");\n    menuL1_icon.push("icon-search");\n}\n'''
              s = s[:m.end()] + inject + s[m.end():]
          state.write_text(s)

          page = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          p = page.read_text()
          p = re.sub(r'show_menu\([^;]*;\s*show_footer\(\);', "show_menu((typeof lan_discovery_menu_index == 'number' && lan_discovery_menu_index > 0) ? lan_discovery_menu_index : 1,0,0); show_footer();", p, count=1)
          if 'lan_custom_rows' not in p:
              marker = '<div class="row-fluid"><div class="span12"><button type="button" class="btn btn-primary" onClick="save();">保存设置</button>'
              if marker not in p:
                  raise SystemExit('save button marker not found')
              rows = '''<h4>自定义 UDP 发现</h4>\n<div class="alert alert-warning">只添加你需要的协议。点击 + 新增一条，点击 − 删除最后一条。最多 6 条；删除后该项不会参与发现。</div>\n<table width="100%" class="table table-condensed"><tr><th>启用</th><th>名称</th><th>UDP端口</th><th>发送内容</th><th>操作</th></tr>\n<div id="lan_custom_rows">\n'''
              for i in range(1,7):
                  rows += f'''<tr id="lan_custom_row_{i}" style="display:{'table-row' if i == 1 else 'none'}"><td><select name="lan_discovery_custom_{i}_enable"><option value="1">是</option><option value="0" selected>否</option></select></td><td><input name="lan_discovery_custom_{i}_name" class="span3" value="<% nvram_get_x("", "lan_discovery_custom_{i}_name"); %>"></td><td><input name="lan_discovery_custom_{i}_port" class="span2" value="<% nvram_get_x("", "lan_discovery_custom_{i}_port"); %>"></td><td><input name="lan_discovery_custom_{i}_payload" class="span5" value="<% nvram_get_x("", "lan_discovery_custom_{i}_payload"); %>"></td><td></td></tr>\n'''
              rows += '''</div></table><div style="margin:8px 0"><button type="button" class="btn btn-success" onclick="lanCustomAdd();">＋ 新增</button> <button type="button" class="btn" onclick="lanCustomRemove();">− 删除</button> <span id="lan_custom_count">1/6</span></div>\n'''
              p = p.replace(marker, rows + marker, 1)
              js = '''\nvar lanCustomCount=1;\nfunction lanCustomSync(){\n  for(var i=1;i<=6;i++){var r=document.getElementById('lan_custom_row_'+i); if(r) r.style.display=(i<=lanCustomCount)?'table-row':'none';}\n  var c=document.getElementById('lan_custom_count'); if(c)c.innerHTML=lanCustomCount+'/6';\n}\nfunction lanCustomAdd(){ if(lanCustomCount<6){lanCustomCount++;lanCustomSync();} }\nfunction lanCustomRemove(){ if(lanCustomCount>1){ var i=lanCustomCount; ['enable','name','port','payload'].forEach(function(x){var e=document.form['lan_discovery_custom_'+i+'_'+x];if(e)e.value=(x=='enable'?'0':'');}); lanCustomCount--;lanCustomSync(); } }\nfunction lanCustomInit(){ var n=1; for(var i=1;i<=6;i++){var nm=document.form['lan_discovery_custom_'+i+'_name'],pt=document.form['lan_discovery_custom_'+i+'_port'],en=document.form['lan_discovery_custom_'+i+'_enable']; if((nm&&nm.value)||(pt&&pt.value)||(en&&en.value=='1')) n=i; } lanCustomCount=n;lanCustomSync(); }\n'''
              p = p.replace('function save(){', js + '\nfunction save(){', 1)
              p = p.replace('show_banner(1);', 'show_banner(1); lanCustomInit();', 1)
          page.write_text(p)
          PY
          chmod +x trunk/user/lan_autodiscover/lan_autodiscover.sh

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install -y fakeroot libtool-bin gperf python3-docutils autopoint gettext p7zip-full

      - name: Shellcheck
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare MIPSel toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Verify Q7 sources
        run: |
          set -e
          test -f trunk/build_firmware_ci
          test -f trunk/configs/templates/ZTE_Q7.config
          test -f trunk/configs/boards/ZTE_Q7/board.h
          test -f trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          test -f trunk/user/camdiscover/camdiscover.c
          test -f trunk/user/camdiscover/dhcpdetect.c
          test -f trunk/user/lan_autodiscover/lan_autodiscover.sh
          test -f trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -q 'dir_y += lan_autodiscover' trunk/user/Makefile
          grep -q 'lan_autodiscover.sh' trunk/user/rc/init.c
          grep -q 'Advanced_LANDiscover_Content.asp' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'lan_discovery_menu_index = menuL1_title.length' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'lanCustomAdd' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -q 'lan_discovery_custom_' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'CUSTOM UDP discovery' trunk/user/camdiscover/camdiscover.c

      - name: Restore upstream userspace baseline
        run: |
          set -e
          git fetch --no-tags origin 0b8c0c504dba197663550f05ef4074a47e653c89 --depth=1
          git checkout 0b8c0c504dba197663550f05ef4074a47e653c89 -- trunk/user/shared/cflags.mk trunk/user/rc/Makefile
          grep -q 'ifneq ($(BOARD_NUM_USB_PORTS),0)' trunk/user/shared/cflags.mk
          grep -q 'hotplug_usb.o usb_modem.o services_usb.o' trunk/user/rc/Makefile

      - name: Normalize Linux 3.4 conntrack Kconfig
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('trunk/linux-3.4.x/net/netfilter/Kconfig')
          s = p.read_text()
          old = 'config NF_CONNTRACK_CHAIN_EVENTS\n\tbool "Register multiple callbacks to ct events"\n\tselect NF_CONNTRACK_EVENTS'
          new = 'config NF_CONNTRACK_CHAIN_EVENTS\n\tbool "Register multiple callbacks to ct events"\n\tdefault n\n\tselect NF_CONNTRACK_EVENTS'
          if old not in s: raise SystemExit('NF_CONNTRACK_CHAIN_EVENTS block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build ZTE_Q7
        run: |
          set -e
          cd trunk
          rm -rf images romfs
          mkdir -p images romfs
          fakeroot ./build_firmware_ci ZTE_Q7
          test -n "$(find images -maxdepth 1 -name '*.trx' -print -quit)"
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M%S')
          SRC=$(find images -maxdepth 1 -name '*.trx' -print -quit)
          cp -f "$SRC" "images/ZTE_Q7_${BUILD_DATE}.trx"
          rm -f images/ZTE_Q7.trx
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          ls -lh images/*.trx

      - name: Upload Q7 firmware
        uses: actions/upload-artifact@v4
        with:
          name: ZTE_Q7_${{ env.BUILD_DATE }}
          path: trunk/images/*.trx
          if-no-files-found: error
