name: 修复设备发现开关与周期参数
on:
  push:
    branches: [ master ]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != '修复设备发现开关与周期参数'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 修改发现控制逻辑
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = worker.read_text(encoding='utf-8')

          old = '''        : > /tmp/camdiscover_lan.log\n        : > /tmp/camdiscover_custom.conf\n'''
          new = '''        # 每一轮重新读取周期和协议参数，使WebUI修改后的配置立即用于下一轮发现。\n        discover_cycle="$(cfg lan_discovery_cycle 10)"\n        case "$discover_cycle" in\n            ''|*[!0-9]*) discover_cycle=10;;\n        esac\n        [ "$discover_cycle" -ge 1 ] 2>/dev/null || discover_cycle=1\n        [ "$discover_cycle" -le 60 ] 2>/dev/null || discover_cycle=60\n        onvif_port="$(cfg lan_discovery_onvif_port 3702)"\n        ssdp_port="$(cfg lan_discovery_ssdp_port 1900)"\n        hik_port="$(cfg lan_discovery_hik_port 37020)"\n        dahua_port="$(cfg lan_discovery_dahua_port 37810)"\n        log_line "本轮设备发现周期 ${discover_cycle}s"\n        : > /tmp/camdiscover_lan.log\n        : > /tmp/camdiscover_custom.conf\n'''
          if old not in s:
              raise SystemExit('未找到设备发现启动位置')
          s = s.replace(old, new, 1)

          old = '''last_iface=""\nlast_state="-9"\niface_refresh=0\nwhile :; do\n'''
          new = '''last_iface=""\nlast_state="-9"\nlast_discover="-9"\niface_refresh=0\nwhile :; do\n'''
          if old not in s:
              raise SystemExit('未找到worker主循环')
          s = s.replace(old, new, 1)

          old = '''    if [ "$iface" != "$last_iface" ]; then\n        last_iface="$iface"\n        last_state="-9"\n'''
          new = '''    if [ "$iface" != "$last_iface" ]; then\n        last_iface="$iface"\n        last_state="-9"\n        last_discover="-9"\n'''
          if old not in s:
              raise SystemExit('未找到接口切换代码')
          s = s.replace(old, new, 1)

          old = '''    enable="$(cfg lan_discovery_enable 1)"\n    iface="$(cfg lan_discovery_ifname eth2.1)"\n'''
          new = '''    enable="$(cfg lan_discovery_enable 1)"\n    discover_enable="$(cfg lan_discovery_discover_enable 1)"\n    iface="$(cfg lan_discovery_ifname eth2.1)"\n'''
          if old not in s:
              raise SystemExit('未找到配置读取代码')
          s = s.replace(old, new, 1)

          old = '''    if [ "$state" != "$last_state" ]; then\n        last_state="$state"\n'''
          new = '''    if [ "$state" != "$last_state" ]; then\n        last_state="$state"\n'''
          if old not in s:
              raise SystemExit('未找到状态变化代码')

          old = '''    fi\n    sleep 1\ndone\n'''
          new = '''    fi\n\n    # 设备发现开关只控制camdiscover，不停止LAN工作进程或DHCP流程。\n    if [ "$state" = "1" ] && [ "$discover_enable" != "$last_discover" ]; then\n        last_discover="$discover_enable"\n        if [ "$discover_enable" = "1" ]; then\n            runtime_set lan_discovery_status_state="启动设备发现"\n            run_discovery "$iface"\n        else\n            runtime_set lan_discovery_status_state="设备发现未启用"\n        fi\n    fi\n    sleep 1\ndone\n'''
          pos = s.rfind(old)
          if pos < 0:
              raise SystemExit('未找到worker主循环结尾')
          s = s[:pos] + new + s[pos+len(old):]
          worker.write_text(s, encoding='utf-8')

          supervisor = Path('trunk/user/lan_autodiscover/lan_discovery_supervisor.sh')
          s = supervisor.read_text(encoding='utf-8')
          old = '''    # 设备发现开关独立于LAN插拔。无需重新插拔网线即可立即停止或恢复发现。\n    if [ "$enable" = "1" ] && [ "$link" = "1" ] && [ "$discover_enable" != "$last_discover" ]; then\n        last_discover="$discover_enable"\n        if [ "$discover_enable" = "1" ]; then\n            runtime_set lan_discovery_status_state="启动设备发现"\n            echo "$(date '+%H:%M:%S') 设备发现已启用" | logger -t lan-supervisor\n            stop_worker\n            start_worker "$iface"\n        else\n            runtime_set lan_discovery_status_state="设备发现未启用"\n            echo "$(date '+%H:%M:%S') 设备发现已禁用" | logger -t lan-supervisor\n            stop_worker\n        fi\n    fi\n\n    # 工作进程异常退出时自动恢复，但设备发现关闭时保持停止。\n    if [ "$link" = "1" ] && [ "$discover_enable" = "1" ]; then\n        start_worker "$iface"\n    fi\n'''
          new = '''    # 设备发现开关只控制发现功能，不停止LAN工作进程、不影响DHCP和LAN接口。\n    if [ "$enable" = "1" ] && [ "$link" = "1" ] && [ "$discover_enable" != "$last_discover" ]; then\n        last_discover="$discover_enable"\n        if [ "$discover_enable" = "1" ]; then\n            runtime_set lan_discovery_status_state="启动设备发现"\n            echo "$(date '+%H:%M:%S') 设备发现已启用" | logger -t lan-supervisor\n        else\n            runtime_set lan_discovery_status_state="设备发现未启用"\n            echo "$(date '+%H:%M:%S') 设备发现已禁用" | logger -t lan-supervisor\n        fi\n    fi\n\n    # LAN口已插入时工作进程持续存在；设备发现是否运行由worker独立控制。\n    if [ "$link" = "1" ]; then\n        start_worker "$iface"\n    fi\n'''
          if old not in s:
              raise SystemExit('未找到supervisor设备发现控制代码')
          s = s.replace(old, new, 1)
          supervisor.write_text(s, encoding='utf-8')
          PY
          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh
          sh -n trunk/user/lan_autodiscover/lan_discovery_supervisor.sh
          git diff --check
      - name: 提交正式源码
        shell: bash
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add trunk/user/lan_autodiscover/lan_autodiscover.sh trunk/user/lan_autodiscover/lan_discovery_supervisor.sh .github/workflows/_lan_discovery_control_fix.yml
          git commit -m '修复设备发现开关与周期参数'
          git rm .github/workflows/_lan_discovery_control_fix.yml
          git commit --amend --no-edit
          git push
