name: Q7 Firmware Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: q7-firmware-build
  cancel-in-progress: true

jobs:
  build-q7:
    name: ZTE_Q7 firmware + discovery tools
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libtool-bin curl cmake gperf gawk flex bison xxd fakeroot kmod cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man pkg-config zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

      - name: Prepare MIPSel toolchain
        working-directory: toolchain-mipsel
        run: sh dl_toolchain.sh

      - name: Verify Q7 and test programs
        run: |
          test -f trunk/configs/templates/ZTE_Q7.config
          test -f trunk/configs/boards/ZTE_Q7/board.h
          test -f trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          test -f trunk/user/camdiscover/camdiscover.c
          test -f trunk/user/camdiscover/Makefile
          test -f trunk/user/netmgr/netmgr.c
          test -f trunk/user/netmgr/Makefile
          grep -q 'camdiscover' trunk/user/Makefile
          grep -q 'netmgr' trunk/user/Makefile
          echo 'Q7 build inputs and discovery programs: OK'

      - name: Build ZTE_Q7
        working-directory: trunk
        run: |
          rm -rf images
          mkdir -p images
          fakeroot ./build_firmware_modify ZTE_Q7

      - name: Verify firmware
        run: |
          set -e
          find trunk/images -maxdepth 1 -type f -printf '%f\n'
          test -n "$(find trunk/images -maxdepth 1 -type f -name '*.trx' -print -quit)"

      - name: SHA256
        run: sha256sum trunk/images/*

      - name: Upload Q7 firmware
        uses: actions/upload-artifact@v4
        with:
          name: ZTE_Q7-SmartLAN-V1
          path: |
            trunk/images/*.trx
            trunk/images/*.bin
          if-no-files-found: error
