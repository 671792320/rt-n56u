name: Q7 Direct Source Once
on:
  push:
    branches: [q7-webui-direct-bde]
jobs:
  direct:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Directly modify Q7 WebUI source
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          page_p=Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          data_p=Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Data.asp')
          page=page_p.read_text(encoding='utf-8')
          data=data_p.read_text(encoding='utf-8')
          data=data.replace('<% nvram_get_x("", "lan_discovery_status_targets"); %>','<% lan_discovery_targets(); %>')
          page=page.replace("devices:section(data,'---DEVICES---','---CUSTOM---'),custom:section(data,'---CUSTOM---','')", "devices:section(data,'---DEVICES---','---TARGETS---'),targets:section(data,'---TARGETS---','---CUSTOM---'),custom:section(data,'---CUSTOM---','')", 1)
          page=page.replace("function make_device_record(type,ip,mac,info){return {ip:ip,mac:mac||'-',info:info||'-',protocols:[],conflict:false,proto_fail:false,miss:0};}", "function make_device_record(type,ip,mac,info){return {ip:ip,mac:mac||'-',info:info||'-',protocols:[],conflict:false,proto_fail:false,miss:0,ping:'不可用',backend_status:''};}", 1)
          page=page.replace("else{var r=merge_device_record(byIp,rows,type,ip,mac,info);if(type==='ARP')currentArp[ip]=1;}}", "else{var r=merge_device_record(byIp,rows,type,ip,mac,info);var pf=(z.match(/PROTO=(.*?) PING=/)||[])[1]||'';var pg=(z.match(/PING=([^ ]+)/)||[])[1]||'';var bs=(z.match(/STATUS=([^ ]+)/)||[])[1]||'';if(r){if(pf){pf.split(/ \/ /).forEach(function(t){add_protocol(r,t);});}if(pg)r.ping=pg;if(bs)r.backend_status=bs;}if(type==='ARP')currentArp[ip]=1;}}", 1)
          page=page.replace("function infer_status(row,type){if(row.conflict)return 'IP冲突';if(row.proto_fail)return '协议异常';if(row.miss>=3)return '暂时离线';return '正常';}", "function infer_status(row,type){if(row.conflict)return 'IP冲突';if(row.backend_status==='在线'||row.backend_status==='暂时离线'||row.backend_status==='IP冲突')return row.backend_status;if(row.ping==='通')return '在线';if(row.proto_fail)return '协议异常';if(row.miss>=3)return '暂时离线';return '在线';}", 1)
          if 'function clean_device_info(v)' not in page:
              page=page.replace('function mac_norm(v){', "function clean_device_info(v){var s=String(v==null?'':v);s=s.replace(/^\\s*Ping：[^；]*；\\s*/,'');s=s.replace(/\\s*STATUS=[^ ]+/g,'');s=s.replace(/\\s*PING=[^ ]+/g,'');s=s.replace(/\\s*MISS=[0-9]+/g,'');s=s.replace(/\\s*Ping：[^；]+；/g,'');s=s.replace(/^设备可达$/,'');s=s.replace(/^[；;、，,\\s]+|[；;、，,\\s]+$/g,'');return s||'-';}\nfunction mac_norm(v){", 1)
          page=page.replace("var info=(z.match(/INFO=(.*)$/)||[])[1]||'-';", "var info=clean_device_info((z.match(/INFO=(.*)$/)||[])[1]||'-');", 1)
          page=page.replace("var vals=[st,protocol,r.ip,displayMac,r.info||'-'];", "var vals=[st,protocol,r.ip,displayMac,r.ping||'不可用',clean_device_info(r.info||'-')];", 1)
          page=page.replace('<th>状态</th><th>协议</th><th>IP</th><th>MAC</th><th>信息</th>', '<th>状态</th><th>协议</th><th>IP</th><th>MAC</th><th>Ping</th><th>信息</th>', 1)
          page=page.replace('colspan="5" class="muted">暂无设备', 'colspan="6" class="muted">暂无设备', 1)
          if 'function render_target_states(s)' not in page:
              fn="function render_target_states(s){var box=document.getElementById('target_states');if(!box)return;var raw=String(s||'').replace(/\\r/g,'');var arr=raw.split(';');var rows=[];for(var i=0;i<arr.length;i++){var line=String(arr[i]||'').replace(/^\\s+|\\s+$/g,'');if(!line)continue;var p=line.split('|');if(p.length<2)continue;var net=String(p[0]||'').trim();var ip=String(p[1]||'').trim();if(!/^((\\d{1,3}\\.){3}\\d{1,3})\\/24$/.test(net)||!/^((\\d{1,3}\\.){3}\\d{1,3})$/.test(ip))continue;rows.push({net:net,ip:ip});}rows.sort(function(a,b){return ip_key(a.net.split('/')[0])-ip_key(b.net.split('/')[0]);});if(!rows.length){box.innerHTML='<div class=\"muted\">当前没有生效的目标网段</div>';return;}var html='<table class=\"table table-bordered table-condensed\"><thead><tr><th>目标网段</th><th>临时IP（SNAT地址）</th><th>状态</th></tr></thead><tbody>';for(var j=0;j<rows.length;j++){html+='<tr><td>'+rows[j].net+'</td><td><strong>'+rows[j].ip+'</strong></td><td>已启用（SNAT）</td></tr>';}html+='</tbody></table>';box.innerHTML=html;}\n"
              page=page.replace('function render_custom_hint()',fn+'function render_custom_hint()',1)
          if 'render_target_states(o.targets)' not in page:
              page=page.replace('render_devices(o.devices);render_log(o.log);','render_devices(o.devices);render_target_states(o.targets);render_log(o.log);',1)
          if 'id="target_states"' not in page:
              page=page.replace('<h4>IP占用情况 ', '<h4 style="margin-top:12px">目标网段与临时IP（SNAT地址）</h4><div class="alert alert-info">下面显示实际生效的目标网段、对应临时IP及SNAT状态。</div><div id="target_states"><div class="muted">等待目标网段状态...</div></div>\n<h4>IP占用情况 ', 1)
          page_p.write_text(page,encoding='utf-8')
          data_p.write_text(data,encoding='utf-8')
          assert '<% lan_discovery_targets(); %>' in data
          assert "targets:section(data,'---TARGETS---','---CUSTOM---')" in page
          assert 'function clean_device_info(v)' in page
          assert 'render_target_states(o.targets)' in page
          assert 'id="target_states"' in page
          assert 'Ping</th>' in page
          PY
      - name: Fix firmware artifact naming and direct version metadata
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/q7-build.yml')
          s=p.read_text(encoding='utf-8')
          old="""          SRC=$(find images -maxdepth 1 -name '*.trx' -print -quit)\n          test -n \"$SRC\"\n          cp -f \"$SRC\" \"images/ZTE_Q7_${VERSION_STAMP}.trx\"\n          rm -f images/ZTE_Q7.trx\n          ls -lh images/*.trx\n"""
          new="""          SRC=$(find images -maxdepth 1 -name '*.trx' ! -name 'ZTE_Q7_*.trx' -print -quit)\n          test -n \"$SRC\"\n          test \"$(find images -maxdepth 1 -name '*.trx' | wc -l)\" -eq 1\n          mv -f \"$SRC\" \"images/ZTE_Q7_${VERSION_STAMP}.trx\"\n          test \"$(find images -maxdepth 1 -name '*.trx' | wc -l)\" -eq 1\n          ls -lh images/*.trx\n"""
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit direct source changes
        run: |
          set -eux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/q7-direct-source-once.yml
          git add trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Data.asp .github/workflows/q7-build.yml .github/workflows/q7-direct-source-once.yml
          git diff --cached --check
          git commit -m '基于成功版本直接修复Q7 WebUI并规范固件版本产物'
          git push origin q7-webui-direct-bde
