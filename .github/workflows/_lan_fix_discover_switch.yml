name: 修复设备发现开关逻辑
on:
  push:
    branches: [ master ]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != '修复设备发现开关独立逻辑'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 修改设备发现开关逻辑
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          worker = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = worker.read_text(encoding='utf-8')
          old = '''    if [ "$discover_enable" != "1" ] || [ ! -x /usr/bin/camdiscover ]; then
        runtime_set lan_discovery_status_state="设备发现未启用"
        return
    fi

    # 发现周期不再清空设备数据库，保证页面和后续转发使用稳定结果。
    sync_device_cache
    runtime_set lan_discovery_status_state="持续设备发现"
    log_line "开始持续设备发现 $iface，探测周期 ${discover_cycle}s"
    while is_link_up "$iface"; do
        if [ "$(cfg lan_discovery_discover_enable 1)" != "1" ]; then
            runtime_set lan_discovery_status_state="设备发现未启用"
            log_line "设备发现已关闭，停止设备发现进程"
            break
        fi
'''
          new = '''    # 设备发现开关只控制camdiscover，不影响LAN和DHCP工作进程。
    if [ ! -x /usr/bin/camdiscover ]; then
        runtime_set lan_discovery_status_state="设备发现程序不存在"
        return
    fi

    # 设备列表持续保存在/tmp，LAN插拔和发现开关切换都不清空。
    sync_device_cache
    while is_link_up "$iface"; do
        if [ "$(cfg lan_discovery_discover_enable 1)" != "1" ]; then
            runtime_set lan_discovery_status_state="设备发现未启用"
            sleep 1
            continue
        fi

        runtime_set lan_discovery_status_state="持续设备发现"
        log_line "开始持续设备发现 $iface，探测周期 ${discover_cycle}s"
'''
          if old not in s:
              raise SystemExit('未找到worker设备发现开关代码')
          s = s.replace(old, new, 1)
          old = '''        wait "$pid" 2>/dev/null
        if [ "$stop_discovery" = "1" ] || [ "$(cfg lan_discovery_discover_enable 1)" != "1" ]; then
            runtime_set lan_discovery_status_state="设备发现未启用"
            break
        fi
'''
          new = '''        wait "$pid" 2>/dev/null
        if [ "$stop_discovery" = "1" ] || [ "$(cfg lan_discovery_discover_enable 1)" != "1" ]; then
            runtime_set lan_discovery_status_state="设备发现未启用"
            sleep 1
            continue
        fi
'''
          if old not in s:
              raise SystemExit('未找到worker发现停止处理代码')
          s = s.replace(old, new, 1)
          worker.write_text(s, encoding='utf-8')

          supervisor = Path('trunk/user/lan_autodiscover/lan_discovery_supervisor.sh')
          s = supervisor.read_text(encoding='utf-8')
          old = '''    # 设备发现开关独立于LAN插拔。无需重新插拔网线即可立即停止或恢复发现。
    if [ "$enable" = "1" ] && [ "$link" = "1" ] && [ "$discover_enable" != "$last_discover" ]; then
        last_discover="$discover_enable"
        if [ "$discover_enable" = "1" ]; then
            runtime_set lan_discovery_status_state="启动设备发现"
            echo "$(date '+%H:%M:%S') 设备发现已启用" | logger -t lan-supervisor
            stop_worker
            start_worker "$iface"
        else
            runtime_set lan_discovery_status_state="设备发现未启用"
            echo "$(date '+%H:%M:%S') 设备发现已禁用" | logger -t lan-supervisor
            stop_worker
        fi
    fi

    # 工作进程异常退出时自动恢复，但设备发现关闭时保持停止。
    if [ "$link" = "1" ] && [ "$discover_enable" = "1" ]; then
        start_worker "$iface"
    fi
'''
          new = '''    # 设备发现开关只改变发现功能，不停止worker；DHCP和LAN监听保持独立运行。
    if [ "$enable" = "1" ] && [ "$link" = "1" ] && [ "$discover_enable" != "$last_discover" ]; then
        last_discover="$discover_enable"
        if [ "$discover_enable" = "1" ]; then
            runtime_set lan_discovery_status_state="启动设备发现"
            echo "$(date '+%H:%M:%S') 设备发现已启用" | logger -t lan-supervisor
        else
            runtime_set lan_discovery_status_state="设备发现未启用"
            echo "$(date '+%H:%M:%S') 设备发现已禁用" | logger -t lan-supervisor
        fi
    fi

    # LAN插入后worker始终运行；是否执行camdiscover由worker内部的设备发现开关决定。
    if [ "$link" = "1" ]; then
        start_worker "$iface"
    fi
'''
          if old not in s:
              raise SystemExit('未找到supervisor设备发现开关代码')
          s = s.replace(old, new, 1)
          supervisor.write_text(s, encoding='utf-8')
          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh
          sh -n trunk/user/lan_autodiscover/lan_discovery_supervisor.sh
          git diff --check
      - name: 提交正式源码
        shell: bash
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add trunk/user/lan_autodiscover/lan_autodiscover.sh trunk/user/lan_autodiscover/lan_discovery_supervisor.sh .github/workflows/_lan_fix_discover_switch.yml
          git commit -m '修复设备发现开关独立逻辑'
          git rm .github/workflows/_lan_fix_discover_switch.yml
          git commit --amend --no-edit
          git push
