name: 修复设备发现与周期页面
on:
  push:
    branches: [ master ]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != '修复设备发现与周期'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 修正LAN发现逻辑与WebUI
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          worker = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = worker.read_text(encoding='utf-8')

          old = '''    if [ "$discover_enable" != "1" ] || [ ! -x /usr/bin/camdiscover ]; then
        runtime_set lan_discovery_status_state="设备发现未启用"
        return
    fi
'''
          new = '''    if [ ! -x /usr/bin/camdiscover ]; then
        runtime_set lan_discovery_status_state="设备发现程序不存在"
        return
    fi

    # 设备发现开关只控制camdiscover，不影响LAN与DHCP工作进程。
    if [ "$discover_enable" != "1" ]; then
        runtime_set lan_discovery_status_state="设备发现未启用"
        log_line "设备发现已关闭，等待重新启用"
    fi
'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '        args="-i $iface -t $probe_timeout -o $onvif_port -s $ssdp_port -k $hik_port -d $dahua_port -O $onvif -S $ssdp -H $hik -D $dahua -A $raw"\n'
          new = '''        args="-i $iface -t $probe_timeout -o $onvif_port -s $ssdp_port -k $hik_port -d $dahua_port"
        [ "$onvif" = "1" ] && args="$args -O"
        [ "$ssdp" = "1" ] && args="$args -S"
        [ "$hik" = "1" ] && args="$args -H"
        [ "$dahua" = "1" ] && args="$args -D"
        [ "$raw" = "1" ] && args="$args -A"
'''
          if old in s:
              s = s.replace(old, new, 1)
          worker.write_text(s, encoding='utf-8')

          cam = Path('trunk/user/camdiscover/camdiscover.c')
          cs = cam.read_text(encoding='utf-8')
          cs = cs.replace('int timeout=10,onvif=1,ssdp=1,hik=1,dahua=1,raw=1,', 'int timeout=10,onvif=0,ssdp=0,hik=0,dahua=0,raw=0,', 1)
          cam.write_text(cs, encoding='utf-8')

          page = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          p = page.read_text(encoding='utf-8')

          def add_after_label(text, label, row):
              if row in text:
                  return text
              pattern = re.compile(r'(<tr>[^\n]*?<th[^>]*>\s*' + re.escape(label) + r'\s*</th>.*?</tr>)', re.S)
              m = pattern.search(text)
              if not m:
                  raise SystemExit('未找到页面行：' + label)
              return text[:m.end(1)] + '\n' + row + text[m.end(1):]

          p = add_after_label(p, 'DHCP检测', '<tr><th>DHCP等待时间</th><td><input class="mini" name="lan_discovery_dhcp_timeout" onkeypress="return is_number(this,event);" value="<% nvram_get_x(\"\", \"lan_discovery_dhcp_timeout\"); %>"> 秒</td></tr>')
          p = add_after_label(p, '设备发现', '<tr><th>设备发现周期</th><td><input class="mini" name="lan_discovery_cycle" onkeypress="return is_number(this,event);" value="<% nvram_get_x(\"\", \"lan_discovery_cycle\"); %>"> 秒</td></tr>')
          p = p.replace('<th>ARP/IP</th>', '<th>ARP</th>')
          p = p.replace('init_itoggle(\'lan_discovery_raw\');', '')
          page.write_text(p, encoding='utf-8')

          # 中文备注：协议开关关闭时不传对应参数，设备发现开关只控制发现程序。
          PY
          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh
          sh -n trunk/user/lan_autodiscover/lan_discovery_supervisor.sh
          grep -q '设备发现已关闭' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q '\[ "$onvif" = "1" \] && args="$args -O"' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'int timeout=10,onvif=0,ssdp=0,hik=0,dahua=0,raw=0' trunk/user/camdiscover/camdiscover.c
          grep -q 'name="lan_discovery_cycle"' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -q 'name="lan_discovery_dhcp_timeout"' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          git diff --check
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add trunk/user/lan_autodiscover/lan_autodiscover.sh trunk/user/camdiscover/camdiscover.c trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          git commit -m '修复设备发现与周期'
          git push
      - name: 清理本临时工作流
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/_lan_fix_discover_switch.yml
          git commit -m '删除临时设备发现修复流程'
          git push
