name: 临时修复LAN状态链路和日志清理同步

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出主线
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: 修复LAN监督器、WebUI日志清理和状态读取
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1. supervisor 使用与 Q7 worker 完全一致的 mtk-esw LAN4 物理链路检测。
          p = Path('trunk/user/lan_autodiscover/lan_discovery_supervisor.sh')
          s = p.read_text(encoding='utf-8')
          old = '''is_link_up() {\n    iface="$1"\n    [ -e "/sys/class/net/$iface" ] || return 1\n    if [ -r "/sys/class/net/$iface/carrier" ]; then\n        [ "$(cat "/sys/class/net/$iface/carrier" 2>/dev/null)" = "1" ] && return 0\n    else\n        [ "$(cat "/sys/class/net/$iface/operstate" 2>/dev/null)" = "up" ] && return 0\n    fi\n    return 1\n}\n'''
          new = '''mtk_esw_lan4_state() {\n    [ -x /sbin/mtk_esw ] || return 2\n    state="$(/sbin/mtk_esw 10 4 2>/dev/null | sed -n 's/^LAN4 link state: \\([01]\\)$/\\1/p')"\n    case "$state" in\n        1) return 0;;\n        0) return 1;;\n    esac\n    return 2\n}\n\nis_link_up() {\n    iface="$1"\n    if [ "$iface" = "eth2.1" ]; then\n        mtk_esw_lan4_state\n        rc=$?\n        [ "$rc" = "0" ] && return 0\n        [ "$rc" = "1" ] && return 1\n    fi\n    [ -e "/sys/class/net/$iface" ] || return 1\n    if [ -r "/sys/class/net/$iface/carrier" ]; then\n        [ "$(cat "/sys/class/net/$iface/carrier" 2>/dev/null)" = "1" ] && return 0\n    else\n        [ "$(cat "/sys/class/net/$iface/operstate" 2>/dev/null)" = "up" ] && return 0\n    fi\n    return 1\n}\n'''
          if old not in s:
              raise SystemExit('supervisor: 未找到原 is_link_up')
          s = s.replace(old, new, 1)
          # 不再让 supervisor 在检测到物理链路 UP 时把状态写成“等待接口”。
          s = s.replace('nvram set lan_discovery_status_state="等待接口"\n            echo "$(date', 'nvram set lan_discovery_status_state="准备启动发现"\n            echo "$(date', 1)
          p.write_text(s, encoding='utf-8')

          # 2. WebUI 清空日志走 Padavan action_script，不再只清 NVRAM 显示字段。
          p = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          s = p.read_text(encoding='utf-8')
          old = '''function clearLog(){if(!login_safe())return false;document.form.lan_discovery_log.value='';applyRule();}'''
          new = '''function clearLog(){\n if(!login_safe())return false;\n showLoading();\n document.form.action_mode.value='Update';\n document.form.action_script.value='lan_discovery_clear_log';\n document.form.current_page.value='Advanced_LANDiscover_Content.asp';\n document.form.next_page.value='';\n document.form.submit();\n return false;\n}'''
          if old not in s:
              raise SystemExit('WebUI: 未找到 clearLog')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3. httpd action_script 增加清理实体日志文件的官方 action_script 入口。
          p = Path('trunk/user/httpd/web_ex.c')
          s = p.read_text(encoding='utf-8')
          marker = '''\telse if (strcmp(name, "syslog.sh")==0)\n\t{'''
          insert = '''\telse if (strcmp(name, "lan_discovery_clear_log")==0)\n\t{\n\t\tFILE *fp;\n\t\tfp = fopen("/etc/storage/lan_discovery.log", "w");\n\t\tif (fp) fclose(fp);\n\t\tnvram_set("lan_discovery_log", "");\n\t\tnvram_set("lan_discovery_status_last", "-");\n\t}\n\telse if (strcmp(name, "syslog.sh")==0)\n\t{'''
          if marker not in s:
              raise SystemExit('web_ex: 未找到 syslog action_script 插入点')
          if 'lan_discovery_clear_log' not in s:
              s = s.replace(marker, insert, 1)
          p.write_text(s, encoding='utf-8')
          PY

          sh -n trunk/user/lan_autodiscover/lan_discovery_supervisor.sh
          git diff --check
          grep -n 'mtk_esw_lan4_state\|lan_discovery_clear_log\|准备启动发现' \
            trunk/user/lan_autodiscover/lan_discovery_supervisor.sh \
            trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp \
            trunk/user/httpd/web_ex.c

      - name: 提交正式源码并清理临时工作流
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_fix_lan_state_sync.yml
          git add trunk/user/lan_autodiscover/lan_discovery_supervisor.sh \
                  trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp \
                  trunk/user/httpd/web_ex.c \
                  .github/workflows/_fix_lan_state_sync.yml
          git diff --cached --check
          git commit -m "修复LAN状态检测与WebUI日志同步"
          git push origin master
