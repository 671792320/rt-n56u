name: Q7 Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    name: ZTE_Q7
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Prepare environment
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y fakeroot libtool-bin gperf python3-docutils autopoint gettext p7zip-full

      - name: Register LAN discovery menu
        shell: bash
        run: |
          set -eux
          grep -q 'menuL1_title = new Array' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'Advanced_LANDiscover_Content.asp' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          sed -i '/^menuL1_icon = new Array/i menuL1_title.push("LAN自动发现");\nmenuL1_link.push("Advanced_LANDiscover_Content.asp");' trunk/user/www/n56u_ribbon_fixed/state.js
          sed -i '/^menuL1_icon = new Array/a menuL1_icon.push("icon-search");' trunk/user/www/n56u_ribbon_fixed/state.js

      - name: Shellcheck
        shell: bash
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare MIPSel toolchain
        shell: bash
        run: |
          set -eux
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Apply Q7 LAN discovery build patches
        shell: bash
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          p = Path('trunk/linux-3.4.x/net/netfilter/Kconfig')
          s = p.read_text()
          old = '''config NF_CONNTRACK_CHAIN_EVENTS\n\tbool "Register multiple callbacks to ct events"\n\tselect NF_CONNTRACK_EVENTS'''
          new = '''config NF_CONNTRACK_CHAIN_EVENTS\n\tbool "Register multiple callbacks to ct events"\n\tdefault n\n\tselect NF_CONNTRACK_EVENTS'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('trunk/user/httpd/httpd.c')
          s = p.read_text()
          old = '''static int\nhttp_login_check(const uaddr *ip_now)\n{\n\tif (is_uaddr_localhost(ip_now))\n\t\treturn 1;\n\n\tif (login_ip.len == 0)\n\t\treturn 2;\n\n\tif (is_uaddr_equal(&login_ip, ip_now))\n\t\treturn 3;\n\n\tif ((unsigned long)(uptime() - login_timestamp) > LOGIN_TIMEOUT) {\n\t\treset_login_data();\n\t\treturn 2;\n\t}\n\n\treturn 0;\n}\n'''
          new = '''static int\nhttp_login_check(const uaddr *ip_now)\n{\n\tif (is_uaddr_localhost(ip_now))\n\t\treturn 1;\n\n\treturn 2;\n}\n'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = p.read_text()

          # 统一中文模块状态和设备发现日志，避免把内部DEVICE格式直接显示给用户。
          helper = r'''
module_cn() {
    [ "$1" = "1" ] && printf '启用' || printf '停用'
}

format_device_log() {
    line="$1"
    type="$(printf '%s\n' "$line" | sed -n 's/.*type=\([^ ]*\).*/\1/p')"
    ip="$(printf '%s\n' "$line" | sed -n 's/.*IP=\([^ ]*\).*/\1/p')"
    mac="$(printf '%s\n' "$line" | sed -n 's/.*MAC=\([^ ]*\).*/\1/p')"
    response_len="$(printf '%s\n' "$line" | sed -n 's/.*response_len=\([0-9][0-9]*\).*/\1/p')"
    [ -n "$ip" ] || return 0
    [ -n "$mac" ] || mac="-"
    case "$mac" in
        ''|-) ;;
        *) ;;
    esac
    case "$mac" in
        ''|-) mac="$(ip neigh show "$ip" 2>/dev/null | awk '$0 !~ /FAILED|INCOMPLETE/ {for(i=1;i<=NF;i++) if($i=="lladdr") {print $(i+1); exit}}')";;
    esac
    [ -n "$mac" ] || mac="-"
    case "$type" in
        HIK|HIK-SADP|hik|hik-sadp) protocol="HIK";;
        DAHUA|DAHUA-DHIP|dahua|dahua-dhip) protocol="DAHUA";;
        ONVIF|onvif) protocol="ONVIF";;
        SSDP|ssdp) protocol="SSDP";;
        ARP|arp) protocol="ARP";;
        *) protocol="$type";;
    esac
    if [ -n "$response_len" ]; then
        log_line "发现设备：IP=$ip 协议=$protocol MAC=$mac 回包响应=${response_len}字节"
    elif [ "$protocol" = "ARP" ]; then
        log_line "发现设备：IP=$ip 协议=ARP MAC=$mac 回包响应=收到ARP回复"
    else
        log_line "发现设备：IP=$ip 协议=$protocol MAC=$mac 回包响应=已收到"
    fi
}

device_state_event() {
    line="$1"
    type="$(printf '%s\n' "$line" | sed -n 's/.*type=\([^ ]*\).*/\1/p')"
    ip="$(printf '%s\n' "$line" | sed -n 's/.*IP=\([^ ]*\).*/\1/p')"
    mac="$(printf '%s\n' "$line" | sed -n 's/.*MAC=\([^ ]*\).*/\1/p')"
    [ -n "$ip" ] || return 0
    case "$type" in
        ARP|arp)
            /usr/bin/lan_device_state.sh arp "$ip" "$mac" 2>/dev/null || :
            ;;
        SUBNET|subnet)
            ;;
        *)
            /usr/bin/lan_device_state.sh proto "$ip" "$type" 2>/dev/null || :
            ;;
    esac
}
'''
          if 'format_device_log() {' not in s:
              marker = 'append_device() {\n'
              if marker not in s:
                  raise SystemExit('未找到设备记录处理函数')
              s = s.replace(marker, helper + '\n' + marker, 1)

          # 所有DEVICE记录统一交给状态跟踪和中文日志函数；不再依赖固定出现次数。
          s = s.replace('                    clean="$(append_device "$line")"\n                    [ -n "$clean" ] && log_line "发现设备：$clean"',
                        '                    device_state_event "$line"\n                    clean="$(append_device "$line")"\n                    [ -n "$clean" ] && format_device_log "$line"')
          s = s.replace('                        clean="$(append_device "$line")"\n                        [ -n "$clean" ] && log_line "发现设备：$clean"',
                        '                        device_state_event "$line"\n                        clean="$(append_device "$line")"\n                        [ -n "$clean" ] && format_device_log "$line"')

          # 清掉旧的英文模块日志，使用中文启用/停用状态。
          old_log = '    log_line "[camdiscover] probes enabled: ONVIF=$onvif SSDP=$ssdp HIK=$hik DAHUA=$dahua ARP=$raw"'
          new_log = '    log_line "发现程序启用模块：ONVIF=$(module_cn "$onvif") SSDP=$(module_cn "$ssdp") HIK=$(module_cn "$hik") DAHUA=$(module_cn "$dahua") ARP=$(module_cn "$raw")"'
          if old_log in s:
              s = s.replace(old_log, new_log, 1)

          # 主动发现状态围绕一整轮建立 begin/finish，且重复应用不会继续插入。
          old_begin = '''        [ "$raw" = "1" ] && run_arpscan "$iface"\n        run_camdiscover "$iface" "$discover_cycle"'''
          new_begin = '''        if [ "$raw" = "1" ]; then\n            /usr/bin/lan_device_state.sh begin\n            run_arpscan "$iface"\n        fi\n        run_camdiscover "$iface" "$discover_cycle"\n        if [ "$raw" = "1" ]; then\n            /usr/bin/lan_device_state.sh finish\n        fi'''
          if old_begin in s:
              s = s.replace(old_begin, new_begin, 1)

          p.write_text(s)

          # WebUI：一个IP一条记录，同时显示协议、MAC和Ping状态。
          p = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          s = p.read_text()
          old = "function make_device_record(type,ip,mac,info){return {ip:ip,mac:mac||'-',info:info||'-',protocols:[],conflict:false,proto_fail:false,miss:0};}"
          new = "function make_device_record(type,ip,mac,info){return {ip:ip,mac:mac||'-',info:info||'-',protocols:[],conflict:false,proto_fail:false,miss:0,ping:'检测中',backend_status:''};}"
          if old in s:
              s = s.replace(old, new, 1)

          old = "else{var r=merge_device_record(byIp,rows,type,ip,mac,info);if(type==='ARP')currentArp[ip]=1;}}"
          new = "else{var r=merge_device_record(byIp,rows,type,ip,mac,info);var pf=(z.match(/PROTO=(.*?) PING=/)||[])[1]||'';var pg=(z.match(/PING=([^ ]+)/)||[])[1]||'';var bs=(z.match(/STATUS=([^ ]+)/)||[])[1]||'';if(r){if(pf){pf.split(/ \/ /).forEach(function(t){add_protocol(r,t);});}if(pg)r.ping=pg;if(bs)r.backend_status=bs;}if(type==='ARP')currentArp[ip]=1;}}"
          if old in s:
              s = s.replace(old, new, 1)

          old = "function infer_status(row,type){if(row.conflict)return 'IP冲突';if(row.proto_fail)return '协议异常';if(row.miss>=3)return '暂时离线';return '正常';}"
          new = "function infer_status(row,type){if(row.conflict)return 'IP冲突';if(row.backend_status==='在线'||row.backend_status==='暂时离线'||row.backend_status==='IP冲突')return row.backend_status;if(row.ping==='通')return '在线';if(row.proto_fail)return '协议异常';if(row.miss>=3)return '暂时离线';return '正常';}"
          if old in s:
              s = s.replace(old, new, 1)

          old = "var vals=[st,protocol,r.ip,displayMac,r.info||'-'];"
          new = "var vals=[st,protocol,r.ip,displayMac,r.ping||'检测中',r.info||'-'];"
          if old in s:
              s = s.replace(old, new, 1)

          old = '<th>状态</th><th>协议</th><th>IP</th><th>MAC</th><th>信息</th>'
          new = '<th>状态</th><th>协议</th><th>IP</th><th>MAC</th><th>Ping</th><th>信息</th>'
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace('colspan="5" class="muted">暂无设备', 'colspan="6" class="muted">暂无设备', 1)
          p.write_text(s)
          PY

      - name: Verify Q7 sources
        shell: bash
        run: |
          set -eux
          test -f trunk/build_firmware_ci
          test -f trunk/configs/templates/ZTE_Q7.config
          test -f trunk/configs/boards/ZTE_Q7/board.h
          test -f trunk/configs/boards/ZTE_Q7/board.mk
          test -f trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          test -f trunk/user/camdiscover/camdiscover_q7_v3.c
          test -f trunk/user/camdiscover/arpscan.c
          test -f trunk/user/camdiscover/Makefile
          test -f trunk/user/camdiscover/dhcpdetect.c
          test -f trunk/user/lan_autodiscover/lan_autodiscover.sh
          test -f trunk/user/lan_autodiscover/lan_device_state.sh
          test -f trunk/user/lan_autodiscover/lan_takeover.sh
          test -f trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -q '状态' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -q 'format_device_log' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'device_state_event' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'lan_device_state.sh begin' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'lan_device_state.sh finish' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'Ping' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh

      - name: Build ZTE_Q7
        shell: bash
        run: |
          set -eux
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M%S')
          VERSION_STAMP=$(date -u +'%y%m%d_%H%M')
          VERSION_STRING="3.4.3.9-${VERSION_STAMP}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "VERSION_STAMP=${VERSION_STAMP}" >> "$GITHUB_ENV"
          sed -i '/Q7固件版本/d' trunk/user/rc/rc.c
          sed -i "/^[[:space:]]*\\/\\/ system ready$/i\\\tnvram_set(\"firmver_sub\", \"${VERSION_STRING}\"); /* Q7固件版本 */" trunk/user/rc/rc.c
          python3 - <<'PY'
          from pathlib import Path

          p = Path('trunk/user/rc/rc.c')
          s = p.read_text()
          marker = '\tklogctl(8, NULL, nvram_get_int("console_loglevel"));'
          insert = '''#if defined(BOARD_ZTE_Q7)\n\t/* Q7无线名称使用设备LAN MAC地址后四位，避免多台Q7名称重复。 */\n\tsnprintf(tmp, sizeof(tmp), "@Seetong-IPCtest-utp2_%s", lan_mac);\n\tnvram_set("wl_ssid", tmp);\n\t/* Q7无线默认密码。 */\n\tnvram_set("wl_wpa_psk", "88888888");\n#endif\n\n'''
          if marker not in s:
              raise SystemExit('未找到无线参数初始化位置')
          if '@Seetong-IPCtest-utp2_' not in s:
              s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
          grep -q '@Seetong-IPCtest-utp2_' trunk/user/rc/rc.c
          grep -q 'nvram_set("wl_wpa_psk", "88888888")' trunk/user/rc/rc.c
          cd trunk
          rm -rf images romfs
          mkdir -p images romfs
          fakeroot ./build_firmware_ci ZTE_Q7
          SRC=$(find images -maxdepth 1 -name '*.trx' -print -quit)
          test -n "$SRC"
          cp -f "$SRC" "images/ZTE_Q7_${VERSION_STAMP}.trx"
          rm -f images/ZTE_Q7.trx
          ls -lh images/*.trx

      - name: Upload Q7 firmware
        uses: actions/upload-artifact@v4
        with:
          name: ZTE_Q7_${{ env.VERSION_STAMP }}
          path: trunk/images/*.trx
          if-no-files-found: error
