name: Q7 Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: q7-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ZTE_Q7 only
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Add LAN discovery level-1 menu
        shell: bash
        run: |
          set -e
          grep -q 'menuL1_title = new Array' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'Advanced_LANDiscover_Content.asp' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          sed -i '/^menuL1_icon = new Array/i menuL1_title.push("LAN自动发现");\nmenuL1_link.push("Advanced_LANDiscover_Content.asp");' trunk/user/www/n56u_ribbon_fixed/state.js
          sed -i '/^menuL1_icon = new Array/a menuL1_icon.push("icon-search");' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_title.push("LAN自动发现")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_link.push("Advanced_LANDiscover_Content.asp")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_icon.push("icon-search")' trunk/user/www/n56u_ribbon_fixed/state.js

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install -y fakeroot libtool-bin gperf python3-docutils autopoint gettext p7zip-full

      - name: 修复LAN监听状态写入
        shell: bash
        run: |
          set -e
          FILE=trunk/user/lan_autodiscover/lan_autodiscover.sh
          if ! grep -q 'Q7固件中的NVRAM写入统一使用键值形式' "$FILE"; then
            sed -i '/^trap '\''rmdir "$LOCKDIR" 2>\/dev\/null'\'' EXIT INT TERM HUP$/a # Q7固件中的NVRAM写入统一使用键值形式。\n_nvram_bin="$(command -v nvram)"\nnvram() {\n    if [ "$1" = "set" ] \&\& [ "$#" -ge 3 ]; then\n        "$_nvram_bin" set "$2=$3"\n    else\n        "$_nvram_bin" "$@"\n    fi\n}' "$FILE"
          fi
          grep -q 'Q7固件中的NVRAM写入统一使用键值形式' "$FILE"
          grep -q '^nvram() {' "$FILE"

      - name: 修复设备发现开关、协议开关和周期
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          sh = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = sh.read_text()

          old = '''    if [ "$discover_enable" != "1" ] || [ ! -x /usr/bin/camdiscover ]; then\n        runtime_set lan_discovery_status_state="设备发现未启用"\n        return\n    fi\n'''
          new = '''    if [ ! -x /usr/bin/camdiscover ]; then\n        runtime_set lan_discovery_status_state="设备发现程序不存在"\n        return\n    fi\n\n    # 设备发现关闭时保持LAN工作进程和DHCP流程，不退出工作进程；等待开关重新打开。\n    if [ "$discover_enable" != "1" ]; then\n        runtime_set lan_discovery_status_state="设备发现未启用"\n        log_line "设备发现已关闭，等待重新启用"\n        while is_link_up "$iface"; do\n            [ "$(cfg lan_discovery_discover_enable 1)" = "1" ] && break\n            sleep 1\n        done\n        discover_enable="$(cfg lan_discovery_discover_enable 1)"\n        [ "$discover_enable" = "1" ] || return\n        runtime_set lan_discovery_status_state="启动设备发现"\n        log_line "设备发现已重新启用"\n    fi\n'''
          if old not in s:
              raise SystemExit('设备发现开关状态块未找到')
          s = s.replace(old, new, 1)

          old = '''        args="-i $iface -t $probe_timeout -o $onvif_port -s $ssdp_port -k $hik_port -d $dahua_port -O $onvif -S $ssdp -H $hik -D $dahua -A $raw"\n'''
          new = '''        args="-i $iface -t $probe_timeout -o $onvif_port -s $ssdp_port -k $hik_port -d $dahua_port"\n        [ "$onvif" = "1" ] && args="$args -O"\n        [ "$ssdp" = "1" ] && args="$args -S"\n        [ "$hik" = "1" ] && args="$args -H"\n        [ "$dahua" = "1" ] && args="$args -D"\n        [ "$raw" = "1" ] && args="$args -A"\n'''
          if old not in s:
              raise SystemExit('协议参数组装未找到')
          s = s.replace(old, new, 1)

          sh.write_text(s)

          c = Path('trunk/user/camdiscover/camdiscover.c')
          cs = c.read_text()
          old = 'int timeout=10,onvif=1,ssdp=1,hik=1,dahua=1,raw=1,'
          new = 'int timeout=10,onvif=0,ssdp=0,hik=0,dahua=0,raw=0,'
          if old not in cs:
              raise SystemExit('camdiscover协议默认值未找到')
          c.write_text(cs.replace(old, new, 1))

          page = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          p = page.read_text()
          p = p.replace('''<tr><th>DHCP检测</th><td>''', '''<tr><th>DHCP检测</th><td>''', 1)
          marker = '''</td></tr>\n<tr><th>设备发现</th>'''
          if marker not in p:
              raise SystemExit('DHCP检测页面行未找到')
          p = p.replace(marker, '''</td></tr>\n<tr><th>DHCP等待时间</th><td><input class="mini" name="lan_discovery_dhcp_timeout" onkeypress="return is_number(this,event);" value="<% nvram_get_x(\"\", \"lan_discovery_dhcp_timeout\"); %>"> 秒</td></tr>\n<tr><th>设备发现</th>''', 1)
          p = p.replace('''<tr><th>设备发现</th><td>''', '''<tr><th>设备发现</th><td>''', 1)
          marker = '''</td></tr>\n<tr><th>ARP/IP</th>'''
          if marker not in p:
              raise SystemExit('设备发现页面行未找到')
          p = p.replace(marker, '''</td></tr>\n<tr><th>设备发现周期</th><td><input class="mini" name="lan_discovery_cycle" onkeypress="return is_number(this,event);" value="<% nvram_get_x(\"\", \"lan_discovery_cycle\"); %>"> 秒</td></tr>\n<tr><th>ARP</th>''', 1)
          page.write_text(p)
          PY

          # 中文备注：协议开关关闭时不传递对应flag；设备发现开关关闭只暂停发现，不影响LAN与DHCP。
          grep -q '设备发现已关闭，等待重新启用' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q '\[ "$onvif" = "1" \] && args="$args -O"' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'int timeout=10,onvif=0,ssdp=0,hik=0,dahua=0,raw=0' trunk/user/camdiscover/camdiscover.c
          grep -q 'name="lan_discovery_cycle"' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp

      - name: Shellcheck
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare MIPSel toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Verify Q7 sources
        run: |
          set -e
          test -f trunk/build_firmware_ci
          test -f trunk/configs/templates/ZTE_Q7.config
          test -f trunk/configs/boards/ZTE_Q7/board.h
          test -f trunk/configs/boards/ZTE_Q7/board.mk
          test -f trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          test -f trunk/user/camdiscover/camdiscover.c
          test -f trunk/user/camdiscover/Makefile
          test -f trunk/user/camdiscover/camdiscover_compat.h
          test -f trunk/user/camdiscover/dhcpdetect.c
          test -f trunk/user/lan_autodiscover/lan_autodiscover.sh
          test -f trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          test -f trunk/user/netmgr/netmgr.c
          test -f trunk/user/netmgr/Makefile
          grep -q 'menuL1_title.push("LAN自动发现")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_link.push("Advanced_LANDiscover_Content.asp")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'Q7固件中的NVRAM写入统一使用键值形式' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q '设备发现已关闭，等待重新启用' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'int timeout=10,onvif=0,ssdp=0,hik=0,dahua=0,raw=0' trunk/user/camdiscover/camdiscover.c
          grep -q 'name="lan_discovery_dhcp_timeout"' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -q 'name="lan_discovery_cycle"' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp

      - name: Normalize Linux 3.4 conntrack Kconfig
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('trunk/linux-3.4.x/net/netfilter/Kconfig')
          s = p.read_text()
          old = '''config NF_CONNTRACK_CHAIN_EVENTS\n\tbool "Register multiple callbacks to ct events"\n\tselect NF_CONNTRACK_EVENTS'''
          new = '''config NF_CONNTRACK_CHAIN_EVENTS\n\tbool "Register multiple callbacks to ct events"\n\tdefault n\n\tselect NF_CONNTRACK_EVENTS'''
          if old not in s:
              raise SystemExit('NF_CONNTRACK_CHAIN_EVENTS block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -A4 -B1 'config NF_CONNTRACK_CHAIN_EVENTS' trunk/linux-3.4.x/net/netfilter/Kconfig

      - name: Build ZTE_Q7
        shell: bash
        run: |
          set -e
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M%S')
          VERSION_STAMP=$(date -u +'%y%m%d_%H%M')
          VERSION_STRING="3.4.3.9-${VERSION_STAMP}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "VERSION_STAMP=${VERSION_STAMP}" >> "$GITHUB_ENV"
          echo "固件版本：${VERSION_STRING}"
          sed -i '/Q7固件版本/d' trunk/user/rc/rc.c
          sed -i "/^[[:space:]]*\/\/ system ready$/i\\\tnvram_set(\"firmver_sub\", \"${VERSION_STRING}\"); /* Q7固件版本 */" trunk/user/rc/rc.c
          grep -n 'nvram_set("firmver_sub"' trunk/user/rc/rc.c
          test "$(grep -c 'nvram_set("firmver_sub"' trunk/user/rc/rc.c)" -eq 1
          cd trunk
          rm -rf images romfs
          mkdir -p images romfs
          fakeroot ./build_firmware_ci ZTE_Q7
          test -n "$(find images -maxdepth 1 -name '*.trx' -print -quit)"
          SRC=$(find images -maxdepth 1 -name '*.trx' -print -quit)
          cp -f "$SRC" "images/ZTE_Q7_${VERSION_STAMP}.trx"
          rm -f images/ZTE_Q7.trx
          ls -lh images/*.trx

      - name: Upload Q7 firmware
        uses: actions/upload-artifact@v4
        with:
          name: ZTE_Q7_${{ env.VERSION_STAMP }}
          path: trunk/images/*.trx
          if-no-files-found: error

# 中文备注：本次提交用于修复设备发现开关、协议开关、周期输入，并触发Q7正式编译。