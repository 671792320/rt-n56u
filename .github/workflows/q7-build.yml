name: Q7 Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: q7-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ZTE_Q7 only
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install -y fakeroot libtool-bin gperf python3-docutils autopoint gettext p7zip-full

      - name: Shellcheck
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare MIPSel toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Verify Q7 and SmartLAN sources
        run: |
          set -e
          test -f trunk/build_firmware_ci
          test -f trunk/configs/templates/ZTE_Q7.config
          test -f trunk/configs/boards/ZTE_Q7/board.h
          test -f trunk/configs/boards/ZTE_Q7/board.mk
          test -f trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          test -f trunk/user/camdiscover/camdiscover.c
          test -f trunk/user/camdiscover/Makefile
          test -f trunk/user/netmgr/netmgr.c
          test -f trunk/user/netmgr/Makefile

      - name: Prepare non-interactive Linux 3.4 config
        run: |
          set -e
          cfg=trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          if grep -q '^CONFIG_NETFILTER_CONNTRACK_CHAIN_EVENTS=' "$cfg"; then
            sed -i 's/^CONFIG_NETFILTER_CONNTRACK_CHAIN_EVENTS=.*/# CONFIG_NETFILTER_CONNTRACK_CHAIN_EVENTS is not set/' "$cfg"
          elif ! grep -q '^# CONFIG_NETFILTER_CONNTRACK_CHAIN_EVENTS is not set' "$cfg"; then
            printf '\n# CONFIG_NETFILTER_CONNTRACK_CHAIN_EVENTS is not set\n' >> "$cfg"
          fi
          grep -q '^# CONFIG_NETFILTER_CONNTRACK_CHAIN_EVENTS is not set' "$cfg"
          echo "Q7 kernel config template prepared"

      - name: Build ZTE_Q7
        run: |
          set -e
          cd trunk
          rm -rf images romfs
          mkdir -p images romfs

          # build_firmware_ci copies the board config into linux-3.4.x/.config
          # internally. Patch the CI copy of the script so that the final kernel
          # config is normalized immediately after that copy and before make dep.
          # This handles NEW Kconfig symbols without changing the existing Q7
          # configuration choices.
          sed -i '/echo "--------------------------MAKE-DEP--------------------------------"/i\yes "" | make ARCH=mips -C linux-3.4.x oldconfig' build_firmware_ci

          fakeroot ./build_firmware_ci ZTE_Q7
          test -n "$(find images -maxdepth 1 -name '*.trx' -print -quit)"
          ls -lh images/*.trx

      - name: Upload Q7 firmware
        uses: actions/upload-artifact@v4
        with:
          name: ZTE_Q7-SmartLAN-V1
          path: trunk/images/*.trx
          if-no-files-found: error
