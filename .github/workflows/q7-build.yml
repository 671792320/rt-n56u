name: Q7 Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: q7-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ZTE_Q7 only
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Add LAN discovery level-1 menu
        shell: bash
        run: |
          set -e
          grep -q 'menuL1_title = new Array' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'Advanced_LANDiscover_Content.asp' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          sed -i '/^menuL1_icon = new Array/i menuL1_title.push("LAN自动发现");\nmenuL1_link.push("Advanced_LANDiscover_Content.asp");' trunk/user/www/n56u_ribbon_fixed/state.js
          sed -i '/^menuL1_icon = new Array/a menuL1_icon.push("icon-search");' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_title.push("LAN自动发现")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_link.push("Advanced_LANDiscover_Content.asp")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_icon.push("icon-search")' trunk/user/www/n56u_ribbon_fixed/state.js

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install -y fakeroot libtool-bin gperf python3-docutils autopoint gettext p7zip-full

      - name: Shellcheck
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare MIPSel toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Verify Q7 sources
        run: |
          set -e
          test -f trunk/build_firmware_ci
          test -f trunk/configs/templates/ZTE_Q7.config
          test -f trunk/configs/boards/ZTE_Q7/board.h
          test -f trunk/configs/boards/ZTE_Q7/board.mk
          test -f trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          test -f trunk/user/camdiscover/camdiscover.c
          test -f trunk/user/camdiscover/Makefile
          test -f trunk/user/camdiscover/camdiscover_compat.h
          test -f trunk/user/camdiscover/dhcpdetect.c
          test -f trunk/user/lan_autodiscover/lan_autodiscover.sh
          test -f trunk/user/lanaccess/lanaccess.sh
          test -f trunk/user/lanaccess/Makefile
          test -f trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          test -f trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Data.asp
          test -f trunk/user/netmgr/netmgr.c
          test -f trunk/user/netmgr/Makefile
          grep -q 'menuL1_title.push("LAN自动发现")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_link.push("Advanced_LANDiscover_Content.asp")' trunk/user/www/n56u_ribbon_fixed/state.js

      - name: Integrate LAN access status into WebUI
        shell: bash
        run: |
          set -e
          P=trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          sed -i '/last:'"'"'<% nvram_get_x("", "lan_discovery_status_last"); %>'"'"'/a\ access:'"'"'<% nvram_get_x("", "lan_access_status"); %>'"'"',\n access_count:'"'"'<% nvram_get_x("", "lan_access_count"); %>'"'"'' "$P"
          sed -i "s/last:value_or(first\[9\],value_or(initial_status.last,'-')),interfaces:/last:value_or(first[9],value_or(initial_status.last,'-')),access:value_or(first[10],value_or(initial_status.access,'等待目标设备')),access_count:value_or(first[11],value_or(initial_status.access_count,'0')),interfaces:/" "$P"
          sed -i "s/\$j('#status_last').text(o.last);/\$j('#status_last').text(o.last);\$j('#status_access').text(o.access);\$j('#status_access_count').text(o.access_count);/" "$P"
          sed -i "s/last:value_or(initial_status.last,'-')});refresh_data();/last:value_or(initial_status.last,'-'),access:value_or(initial_status.access,'等待目标设备'),access_count:value_or(initial_status.access_count,'0')});refresh_data();/" "$P"
          sed -i 's#<tr><td>已发现</td><td id="status_count">0</td><td>最后活动</td><td id="status_last">-</td></tr></table>#<tr><td>已发现</td><td id="status_count">0</td><td>最后活动</td><td id="status_last">-</td></tr><tr><td>目标访问</td><td id="status_access">等待目标设备</td><td>已建立通道</td><td id="status_access_count">0</td></tr></table>#' "$P"
          grep -q 'lan_access_status' "$P"
          grep -q 'lan_access_count' "$P"
          grep -q 'status_access' "$P"
          grep -q 'status_access_count' "$P"
          echo 'LAN access WebUI integration OK'

      - name: Normalize Linux 3.4 conntrack Kconfig
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('trunk/linux-3.4.x/net/netfilter/Kconfig')
          s = p.read_text()
          old = '''config NF_CONNTRACK_CHAIN_EVENTS
\tbool "Register multiple callbacks to ct events"
\tselect NF_CONNTRACK_EVENTS'''
          new = '''config NF_CONNTRACK_CHAIN_EVENTS
\tbool "Register multiple callbacks to ct events"
\tdefault n
\tselect NF_CONNTRACK_EVENTS'''
          if old not in s:
              raise SystemExit('NF_CONNTRACK_CHAIN_EVENTS block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -A4 -B1 'config NF_CONNTRACK_CHAIN_EVENTS' trunk/linux-3.4.x/net/netfilter/Kconfig

      - name: Build ZTE_Q7
        shell: bash
        run: |
          set -e
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M%S')
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          sed -i "s/^FIRMWARE_BUILDS_VER=.*/FIRMWARE_BUILDS_VER=${BUILD_DATE}/" trunk/versions.inc
          sed -i "s|^FIRMWARE_BUILDS_REV=.*|FIRMWARE_BUILDS_REV=${BUILD_DATE}|" trunk/versions.inc
          echo "Firmware build version: ${BUILD_DATE}"
          grep '^FIRMWARE_' trunk/versions.inc
          cd trunk
          rm -rf images romfs
          mkdir -p images romfs
          fakeroot ./build_firmware_ci ZTE_Q7
          test -n "$(find images -maxdepth 1 -name '*.trx' -print -quit)"
          SRC=$(find images -maxdepth 1 -name '*.trx' -print -quit)
          cp -f "$SRC" "images/ZTE_Q7_${BUILD_DATE}.trx"
          rm -f images/ZTE_Q7.trx
          ls -lh images/*.trx

      - name: Upload Q7 firmware
        uses: actions/upload-artifact@v4
        with:
          name: ZTE_Q7_${{ env.BUILD_DATE }}
          path: trunk/images/*.trx
          if-no-files-found: error
