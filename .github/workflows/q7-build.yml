name: Q7 Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: q7-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ZTE_Q7 only
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Patch LAN monitor sources
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          sh_path = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = sh_path.read_text()
          marker = "trap 'rmdir \"$LOCKDIR\" 2>/dev/null' EXIT INT TERM HUP\n"
          if 'DEVICE_DB=/etc/storage/lan_discovery_devices.db' not in s:
              s = s.replace(marker, marker + '\n# LAN监听结果使用持久化文件保存，避免大量内容占用NVRAM。\nDEVICE_DB=/etc/storage/lan_discovery_devices.db\nLOG_FILE=/etc/storage/lan_discovery.log\nmkdir -p /etc/storage\ntouch "$DEVICE_DB" "$LOG_FILE"\n', 1)
          s = re.sub(r'ensure_defaults\(\) \{.*?\n\}', '''ensure_defaults() {
              [ -n "$(nv lan_discovery_enable)" ] || nvram set lan_discovery_enable=1
              [ -n "$(nv lan_discovery_ifname)" ] || nvram set lan_discovery_ifname=eth2.1
              [ -n "$(nv lan_discovery_dhcp_enable)" ] || nvram set lan_discovery_dhcp_enable=1
              [ -n "$(nv lan_discovery_dhcp_timeout)" ] || nvram set lan_discovery_dhcp_timeout=3
              [ -n "$(nv lan_discovery_discover_enable)" ] || nvram set lan_discovery_discover_enable=1
              [ -n "$(nv lan_discovery_cycle)" ] || nvram set lan_discovery_cycle=10
              [ -n "$(nv lan_discovery_onvif)" ] || nvram set lan_discovery_onvif=1
              [ -n "$(nv lan_discovery_onvif_port)" ] || nvram set lan_discovery_onvif_port=3702
              [ -n "$(nv lan_discovery_ssdp)" ] || nvram set lan_discovery_ssdp=1
              [ -n "$(nv lan_discovery_ssdp_port)" ] || nvram set lan_discovery_ssdp_port=1900
              [ -n "$(nv lan_discovery_hik)" ] || nvram set lan_discovery_hik=1
              [ -n "$(nv lan_discovery_hik_port)" ] || nvram set lan_discovery_hik_port=37020
              [ -n "$(nv lan_discovery_dahua)" ] || nvram set lan_discovery_dahua=1
              [ -n "$(nv lan_discovery_dahua_port)" ] || nvram set lan_discovery_dahua_port=37810
              [ -n "$(nv lan_discovery_raw)" ] || nvram set lan_discovery_raw=1
              [ -n "$(nv lan_discovery_status_dhcp)" ] || nvram set lan_discovery_status_dhcp="未检测"
              [ -n "$(nv lan_discovery_status_state)" ] || nvram set lan_discovery_status_state="空闲"
              [ -n "$(nv lan_discovery_status_count)" ] || nvram set lan_discovery_status_count=0
              [ -n "$(nv lan_discovery_status_last)" ] || nvram set lan_discovery_status_last="-"
          }''', s, count=1, flags=re.S)
          s = re.sub(r'log_line\(\) \{.*?\n\}', '''log_line() {
              line="$(sanitize_text "$(now) $*")"
              printf '%s\\n' "$line" >> "$LOG_FILE"
              tail -n 200 "$LOG_FILE" > "${LOG_FILE}.tmp" 2>/dev/null && mv -f "${LOG_FILE}.tmp" "$LOG_FILE"
              # 页面只保留最近30行，完整日志保存在持久化文件中。
              recent="$(tail -n 30 "$LOG_FILE" 2>/dev/null)"
              nvram set lan_discovery_log "$recent"
              nvram set lan_discovery_status_last "$(now)"
              logger -t lan-autodiscover "$(sanitize_text "$*")"
          }''', s, count=1, flags=re.S)
          helpers = '''
sort_device_db() {
    [ -f "$DEVICE_DB" ] || return
    tmp="${DEVICE_DB}.tmp"
    : > "$tmp"
    while IFS= read -r row; do
        [ -n "$row" ] || continue
        ip="$(printf '%s\\n' "$row" | sed -n 's/.* IP=\\([^ ]*\\).*/\\1/p')"
        key="$(printf '%s\\n' "$ip" | awk -F. 'NF==4 {printf "%03d%03d%03d%03d",$1,$2,$3,$4}')"
        [ -n "$key" ] || key=999999999999
        printf '%s|%s\\n' "$key" "$row"
    done < "$DEVICE_DB" | sort -n | cut -d'|' -f2- > "$tmp"
    mv -f "$tmp" "$DEVICE_DB"
    tail -n 100 "$DEVICE_DB" > "${DEVICE_DB}.tmp" 2>/dev/null && mv -f "${DEVICE_DB}.tmp" "$DEVICE_DB"
}
sync_device_cache() {
    sort_device_db
    nvram set lan_discovery_devices "$(tail -n 40 "$DEVICE_DB" 2>/dev/null)"
    count="$(wc -l < "$DEVICE_DB" 2>/dev/null | tr -d ' ')"
    nvram set lan_discovery_status_count "${count:-0}"
}
'''
          if 'sort_device_db() {' not in s:
              s = s.replace('\nappend_device() {', helpers + '\nappend_device() {', 1)
          s = re.sub(r'append_device\(\) \{.*?\n\}', '''append_device() {
    line="$(sanitize_text "$1")"; [ -n "$line" ] || return
    line="$(printf '%s' "$line" | sed 's/\\\\//g')"
    mac="$(printf '%s\\n' "$line" | sed -n 's/.* MAC=//p' | awk '{print $1}')"
    if [ -n "$mac" ]; then
        mac="$(sanitize_mac "$mac")"
        line="$(printf '%s\\n' "$line" | sed "s/ MAC=[^ ]*/ MAC=$mac/")"
    fi
    ip="$(printf '%s\\n' "$line" | sed -n 's/.* IP=\\([^ ]*\\).*/\\1/p')"
    [ -n "$ip" ] || return
    tmp="${DEVICE_DB}.tmp"
    : > "$tmp"
    awk -v ip="$ip" 'index($0," IP=" ip " ")==0 && index($0," IP=" ip)==0 {print}' "$DEVICE_DB" 2>/dev/null >> "$tmp"
    printf '%s\\n' "$line" >> "$tmp"
    mv -f "$tmp" "$DEVICE_DB"
    sync_device_cache
}''', s, count=1, flags=re.S)
          s = s.replace('nvram set lan_discovery_devices=""; nvram set lan_discovery_status_count="0"; nvram set lan_discovery_status_state="持续设备发现";', ': > "$DEVICE_DB"; sync_device_cache; nvram set lan_discovery_status_state="持续设备发现";', 1)
          s = s.replace('DEVICE\\ *) append_device "$line"; log_line "$line";;', 'DEVICE\\ *) append_device "$line"; line="$(printf \'%s\' "$line" | sed \'s/\\\\\\\\//g\')"; log_line "$line";;', 1)
          sh_path.write_text(s)

          asp_path = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          a = asp_path.read_text()
          if 'var device_rows=[];var device_page=1;' not in a:
              a = a.replace('var refresh_timer=null;', 'var refresh_timer=null;var device_rows=[];var device_page=1;', 1)
          a = re.sub(r'function render_devices\(s\)\{.*?\n\}\nfunction render_log', '''function render_devices(s){
 var body=document.getElementById('devices');if(!body)return;var ls=lines(s),byIp={},rows=[];
 for(var i=0;i<ls.length;i++){
  var z=ls[i];if(z.indexOf('DEVICE ')!==0)continue;var type=(z.match(/type=([^ ]+)/)||[])[1]||'-';var ip=(z.match(/IP=([^ ]+)/)||[])[1]||'-';var mac=mac_norm((z.match(/MAC=([^ ]+)/)||[])[1]||'-');var info=(z.match(/INFO=(.*)$/)||[])[1]||'-';
  if(byIp[ip]){var rr=byIp[ip];if(type!=='-'&&rr.type.indexOf(type)<0)rr.type=rr.type==='-'?type:rr.type+'/'+type;if(rr.mac==='-'&&mac!=='-')rr.mac=mac;if((rr.info==='-'||!rr.info)&&info!=='-')rr.info=info;}else{var row={type:type,ip:ip,mac:mac,info:info};byIp[ip]=row;rows.push(row);}
 }
 rows.sort(function(a,b){function key(ip){var p=ip.split('.');return p.length===4?(((+p[0])*256+(+p[1]))*256+(+p[2]))*256+(+p[3]):4294967295;}return key(a.ip)-key(b.ip);});device_rows=rows;var pages=Math.max(1,Math.ceil(rows.length/5));if(device_page>pages)device_page=pages;
 body.innerHTML='';var start=(device_page-1)*5,end=Math.min(start+5,rows.length);for(var j=start;j<end;j++){var r=rows[j],tr=document.createElement('tr'),cells=[];for(var c=0;c<5;c++){cells[c]=document.createElement('td');tr.appendChild(cells[c]);}cells[0].textContent=j+1;cells[1].textContent=r.type;cells[2].textContent=r.ip;cells[3].textContent=r.mac;cells[4].textContent=r.info;body.appendChild(tr);}if(!body.children.length)body.innerHTML='<tr><td colspan="5" class="muted">暂无设备</td></tr>';
 var pager=document.getElementById('device_pager');if(pager){pager.innerHTML='';if(rows.length){var tip=document.createElement('span');tip.className='muted';tip.innerHTML='第 '+device_page+' / '+pages+' 页，共 '+rows.length+' 台';pager.appendChild(tip);var prev=document.createElement('button');prev.type='button';prev.className='btn btn-small';prev.style.marginLeft='8px';prev.disabled=device_page<=1;prev.innerHTML='上一页';prev.onclick=function(){if(device_page>1){device_page--;render_devices(s);}};pager.appendChild(prev);var next=document.createElement('button');next.type='button';next.className='btn btn-small';next.style.marginLeft='4px';next.disabled=device_page>=pages;next.innerHTML='下一页';next.onclick=function(){if(device_page<pages){device_page++;render_devices(s);}};pager.appendChild(next);}}
}
function render_log''', a, count=1, flags=re.S)
          if '<tbody id="devices"></tbody>' in a and 'id="device_pager"' not in a:
              a = re.sub(r'(<tbody id="devices"></tbody>\s*</table>)', r'\1<div id="device_pager" style="padding:6px 0;text-align:right"></div>', a, count=1)
          asp_path.write_text(a)
          PY
          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'DEVICE_DB=/etc/storage/lan_discovery_devices.db' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'device_pager' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp

      - name: Add LAN discovery level-1 menu
        shell: bash
        run: |
          set -e
          grep -q 'menuL1_title = new Array' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'Advanced_LANDiscover_Content.asp' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          sed -i '/^menuL1_icon = new Array/i menuL1_title.push("LAN自动发现");\nmenuL1_link.push("Advanced_LANDiscover_Content.asp");' trunk/user/www/n56u_ribbon_fixed/state.js
          sed -i '/^menuL1_icon = new Array/a menuL1_icon.push("icon-search");' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_title.push("LAN自动发现")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_link.push("Advanced_LANDiscover_Content.asp")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_icon.push("icon-search")' trunk/user/www/n56u_ribbon_fixed/state.js

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install -y fakeroot libtool-bin gperf python3-docutils autopoint gettext p7zip-full

      - name: Shellcheck
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare MIPSel toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Verify Q7 sources
        run: |
          set -e
          test -f trunk/build_firmware_ci
          test -f trunk/configs/templates/ZTE_Q7.config
          test -f trunk/configs/boards/ZTE_Q7/board.h
          test -f trunk/configs/boards/ZTE_Q7/board.mk
          test -f trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          test -f trunk/user/camdiscover/camdiscover.c
          test -f trunk/user/camdiscover/Makefile
          test -f trunk/user/camdiscover/camdiscover_compat.h
          test -f trunk/user/camdiscover/dhcpdetect.c
          test -f trunk/user/lan_autodiscover/lan_autodiscover.sh
          test -f trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          test -f trunk/user/netmgr/netmgr.c
          test -f trunk/user/netmgr/Makefile
          grep -q 'menuL1_title.push("LAN自动发现")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_link.push("Advanced_LANDiscover_Content.asp")' trunk/user/www/n56u_ribbon_fixed/state.js

      - name: Normalize Linux 3.4 conntrack Kconfig
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('trunk/linux-3.4.x/net/netfilter/Kconfig')
          s = p.read_text()
          old = '''config NF_CONNTRACK_CHAIN_EVENTS\n\tbool "Register multiple callbacks to ct events"\n\tselect NF_CONNTRACK_EVENTS'''
          new = '''config NF_CONNTRACK_CHAIN_EVENTS\n\tbool "Register multiple callbacks to ct events"\n\tdefault n\n\tselect NF_CONNTRACK_EVENTS'''
          if old not in s:
              raise SystemExit('NF_CONNTRACK_CHAIN_EVENTS block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -A4 -B1 'config NF_CONNTRACK_CHAIN_EVENTS' trunk/linux-3.4.x/net/netfilter/Kconfig

      - name: Build ZTE_Q7
        shell: bash
        run: |
          set -e
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M%S')
          VERSION_STAMP=$(date -u +'%y%m%d_%H%M')
          VERSION_STRING="3.4.3.9-${VERSION_STAMP}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "VERSION_STAMP=${VERSION_STAMP}" >> "$GITHUB_ENV"
          echo "固件版本：${VERSION_STRING}"
          python3 - <<PY
          from pathlib import Path
          import re
          p = Path('trunk/user/rc/rc.c')
          s = p.read_text()
          s = re.sub(r'\n#ifdef Q7_FIRMWARE_VERSION.*?#endif\n', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*nvram_set\("firmver_sub", "[^"]*"\);\n', '\n', s)
          marker = '\t// system ready'
          line = f'\tnvram_set("firmver_sub", "${VERSION_STRING}");\n'
          if marker not in s:
              raise SystemExit('没有找到系统就绪位置')
          s = s.replace(marker, line + marker, 1)
          p.write_text(s)
          PY
          grep -n 'nvram_set("firmver_sub"' trunk/user/rc/rc.c
          test "$(grep -c 'nvram_set("firmver_sub"' trunk/user/rc/rc.c)" -eq 1
          cd trunk
          rm -rf images romfs
          mkdir -p images romfs
          fakeroot ./build_firmware_ci ZTE_Q7
          test -n "$(find images -maxdepth 1 -name '*.trx' -print -quit)"
          SRC=$(find images -maxdepth 1 -name '*.trx' -print -quit)
          cp -f "$SRC" "images/ZTE_Q7_${VERSION_STAMP}.trx"
          rm -f images/ZTE_Q7.trx
          ls -lh images/*.trx

      - name: Upload Q7 firmware
        uses: actions/upload-artifact@v4
        with:
          name: ZTE_Q7_${{ env.VERSION_STAMP }}
          path: trunk/images/*.trx
          if-no-files-found: error
