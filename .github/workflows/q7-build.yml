name: Q7 Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: q7-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ZTE_Q7 only
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Register LAN discovery native WebUI menu
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          state = Path('trunk/user/www/n56u_ribbon_fixed/state.js')
          page = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')

          s = state.read_text()
          anchor = 'menuL1_icon = new Array("", "icon-home", "icon-hdd", "icon-retweet", "icon-globe", "icon-tasks", "icon-random", "icon-wrench");'
          if 'Advanced_LANDiscover_Content.asp' not in s:
              if anchor not in s:
                  raise SystemExit('native menu anchor not found')
              insert = anchor + r'''

/* LAN discovery: native Level-1 menu entry. */
var _lan_discovery_menu_registered = 0;
for (var _lan_discovery_i = 0; _lan_discovery_i < menuL1_link.length; _lan_discovery_i++) {
	if (menuL1_link[_lan_discovery_i] == "Advanced_LANDiscover_Content.asp") {
		_lan_discovery_menu_registered = 1;
		break;
	}
}
if (!_lan_discovery_menu_registered) {
	menuL1_title.push("LAN自动发现");
	menuL1_link.push("Advanced_LANDiscover_Content.asp");
	menuL1_icon.push("icon-search");
}'''
              s = s.replace(anchor, insert, 1)
              state.write_text(s)

          p = page.read_text()
          p = re.sub(r'/\* Do not modify global state\.js menu tables\..*?\n\}\n\n', '', p, flags=re.S)
          p = re.sub(r'function add_lan_discovery_menu\(\)\{.*?\n\}\n\n', '', p, flags=re.S)
          if 'function get_lan_discovery_menu_index()' not in p:
              helper = '''function get_lan_discovery_menu_index(){
	var i;
	for(i=1;i<menuL1_link.length;i++){
		if(menuL1_link[i] == "Advanced_LANDiscover_Content.asp") return i;
	}
	return 0;
}

'''
              p = p.replace('function initial(){', helper + 'function initial(){', 1)
          p = re.sub(r'\n\s*if\(typeof\(show_menu\) == \'function\'\) show_menu\(5,7,6\);', '\n\tshow_menu(get_lan_discovery_menu_index(),0,0);', p, count=1)
          p = p.replace('\n\tadd_lan_discovery_menu();', '')
          page.write_text(p)
          PY

          grep -q 'menuL1_title.push("LAN自动发现")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_link.push("Advanced_LANDiscover_Content.asp")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_icon.push("icon-search")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'get_lan_discovery_menu_index' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          ! grep -q 'add_lan_discovery_menu' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install -y fakeroot libtool-bin gperf python3-docutils autopoint gettext p7zip-full

      - name: Shellcheck
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare MIPSel toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Verify Q7 sources
        run: |
          set -e
          test -f trunk/build_firmware_ci
          test -f trunk/configs/templates/ZTE_Q7.config
          test -f trunk/configs/boards/ZTE_Q7/board.h
          test -f trunk/configs/boards/ZTE_Q7/board.mk
          test -f trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          test -f trunk/user/camdiscover/camdiscover.c
          test -f trunk/user/camdiscover/Makefile
          test -f trunk/user/camdiscover/camdiscover_compat.h
          test -f trunk/user/camdiscover/dhcpdetect.c
          test -f trunk/user/lan_autodiscover/lan_autodiscover.sh
          test -f trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          test -f trunk/user/netmgr/netmgr.c
          test -f trunk/user/netmgr/Makefile
          grep -q 'menuL1_title.push("LAN自动发现")' trunk/user/www/n56u_ribbon_fixed/state.js
          grep -q 'menuL1_link.push("Advanced_LANDiscover_Content.asp")' trunk/user/www/n56u_ribbon_fixed/state.js

      - name: Restore upstream userspace baseline
        run: |
          set -e
          git fetch --no-tags origin 0b8c0c504dba197663550f05ef4074a47e653c89 --depth=1
          git checkout 0b8c0c504dba197663550f05ef4074a47e653c89 -- trunk/user/shared/cflags.mk trunk/user/rc/Makefile
          grep -q 'ifneq ($(BOARD_NUM_USB_PORTS),0)' trunk/user/shared/cflags.mk
          grep -q 'hotplug_usb.o usb_modem.o services_usb.o' trunk/user/rc/Makefile

      - name: Normalize Linux 3.4 conntrack Kconfig
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('trunk/linux-3.4.x/net/netfilter/Kconfig')
          s = p.read_text()
          old = '''config NF_CONNTRACK_CHAIN_EVENTS\n\tbool "Register multiple callbacks to ct events"\n\tselect NF_CONNTRACK_EVENTS'''
          new = '''config NF_CONNTRACK_CHAIN_EVENTS\n\tbool "Register multiple callbacks to ct events"\n\tdefault n\n\tselect NF_CONNTRACK_EVENTS'''
          if old not in s:
              raise SystemExit('NF_CONNTRACK_CHAIN_EVENTS block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -A4 -B1 'config NF_CONNTRACK_CHAIN_EVENTS' trunk/linux-3.4.x/net/netfilter/Kconfig

      - name: Build ZTE_Q7
        run: |
          set -e
          cd trunk
          rm -rf images romfs
          mkdir -p images romfs
          fakeroot ./build_firmware_ci ZTE_Q7
          test -n "$(find images -maxdepth 1 -name '*.trx' -print -quit)"
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M%S')
          SRC=$(find images -maxdepth 1 -name '*.trx' -print -quit)
          cp -f "$SRC" "images/ZTE_Q7_${BUILD_DATE}.trx"
          rm -f images/ZTE_Q7.trx
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          ls -lh images/*.trx

      - name: Upload Q7 firmware
        uses: actions/upload-artifact@v4
        with:
          name: ZTE_Q7_${{ env.BUILD_DATE }}
          path: trunk/images/*.trx
          if-no-files-found: error
