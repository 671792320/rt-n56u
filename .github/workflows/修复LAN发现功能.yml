name: 修复LAN发现功能
on:
  push:
    branches: [ master ]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != '修复LAN发现协议开关、周期与自定义接口'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 修复发现程序
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cam = Path('trunk/user/camdiscover/camdiscover.c')
          s = cam.read_text(encoding='utf-8')
          s = s.replace('"i:t:o:s:k:d:OSHDAC:"', '"i:t:o:s:k:d:O:S:H:D:A:C:"', 1)
          old = "case 'o':onvif_port=atoi(optarg);break;case 's':ssdp_port=atoi(optarg);break;case 'k':hik_port=atoi(optarg);break;case 'd':dahua_port=atoi(optarg);break;case 'O':onvif=1;break;case 'S':ssdp=1;break;case 'H':hik=1;break;case 'D':dahua=1;break;case 'A':raw=1;break;case 'C':custom_path=optarg;break;default:break;"
          new = "case 'o':onvif_port=atoi(optarg);break;case 's':ssdp_port=atoi(optarg);break;case 'k':hik_port=atoi(optarg);break;case 'd':dahua_port=atoi(optarg);break;case 'O':onvif=atoi(optarg)!=0;break;case 'S':ssdp=atoi(optarg)!=0;break;case 'H':hik=atoi(optarg)!=0;break;case 'D':dahua=atoi(optarg)!=0;break;case 'A':raw=atoi(optarg)!=0;break;case 'C':custom_path=optarg;break;default:break;"
          if old not in s: raise SystemExit('协议开关解析未找到')
          s = s.replace(old, new, 1)
          start = s.find('    if(proto==ETH_P_ARP')
          ipstart = s.find('    if(proto==ETH_P_IP', start)
          if start < 0 or ipstart < 0: raise SystemExit('ARP/IP处理未找到')
          end = s.find('    return 1;\n}', ipstart)
          if end < 0: raise SystemExit('RAW处理结尾未找到')
          s = s[:ipstart] + s[end:]
          cam.write_text(s, encoding='utf-8')

          worker = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = worker.read_text(encoding='utf-8')
          old = '''        discover_cycle="$(cfg lan_discovery_cycle 10)"
        case "$discover_cycle" in
            ''|*[!0-9]*) discover_cycle=10;;
        esac
        [ "$discover_cycle" -ge 1 ] 2>/dev/null || discover_cycle=1
        [ "$discover_cycle" -le 60 ] 2>/dev/null || discover_cycle=60
        onvif_port="$(cfg lan_discovery_onvif_port 3702)"
        ssdp_port="$(cfg lan_discovery_ssdp_port 1900)"
        hik_port="$(cfg lan_discovery_hik_port 37020)"
        dahua_port="$(cfg lan_discovery_dahua_port 37810)"
        log_line "本轮设备发现周期 ${discover_cycle}s"
        : > /tmp/camdiscover_lan.log
        : > /tmp/camdiscover_custom.conf'''
          new = '''        discover_cycle="$(cfg lan_discovery_cycle 10)"
        case "$discover_cycle" in
            ''|*[!0-9]*) discover_cycle=10;;
        esac
        [ "$discover_cycle" -ge 1 ] 2>/dev/null || discover_cycle=1
        [ "$discover_cycle" -le 3600 ] 2>/dev/null || discover_cycle=3600
        onvif="$(cfg lan_discovery_onvif 1)"
        ssdp="$(cfg lan_discovery_ssdp 1)"
        hik="$(cfg lan_discovery_hik 1)"
        dahua="$(cfg lan_discovery_dahua 1)"
        raw="$(cfg lan_discovery_raw 1)"
        onvif_port="$(cfg lan_discovery_onvif_port 3702)"
        ssdp_port="$(cfg lan_discovery_ssdp_port 1900)"
        hik_port="$(cfg lan_discovery_hik_port 37020)"
        dahua_port="$(cfg lan_discovery_dahua_port 37810)"
        custom="$(nv lan_discovery_custom)"
        probe_timeout=5
        [ "$discover_cycle" -lt "$probe_timeout" ] 2>/dev/null && probe_timeout="$discover_cycle"
        [ "$probe_timeout" -ge 1 ] 2>/dev/null || probe_timeout=1
        round_start="$(date +%s)"
        log_line "本轮设备发现周期 ${discover_cycle}s，响应等待 ${probe_timeout}s"
        : > /tmp/camdiscover_lan.log
        : > /tmp/camdiscover_custom.conf'''
          if old not in s: raise SystemExit('周期代码未找到')
          s = s.replace(old, new, 1)
          s = s.replace('args="-i $iface -t $discover_cycle -o $onvif_port', 'args="-i $iface -t $probe_timeout -o $onvif_port', 1)
          old = '''        log_line "本轮主动探测完成，继续监听，下一轮 ${discover_cycle}s"
        sleep 1'''
          new = '''        elapsed=$(( $(date +%s) - round_start ))
        wait_seconds=$((discover_cycle - elapsed))
        [ "$wait_seconds" -lt 0 ] 2>/dev/null && wait_seconds=0
        log_line "本轮主动探测完成，下一轮周期 ${discover_cycle}s"
        while [ "$wait_seconds" -gt 0 ]; do
            if [ "$(cfg lan_discovery_discover_enable 1)" != "1" ]; then
                runtime_set lan_discovery_status_state="设备发现未启用"
                break
            fi
            if ! is_link_up "$iface"; then
                break
            fi
            sleep 1
            wait_seconds=$((wait_seconds - 1))
        done'''
          if old not in s: raise SystemExit('周期等待代码未找到')
          s = s.replace(old, new, 1)
          worker.write_text(s, encoding='utf-8')

          supervisor = Path('trunk/user/lan_autodiscover/lan_discovery_supervisor.sh')
          s = supervisor.read_text(encoding='utf-8')
          old = '''            runtime_set lan_discovery_status_count="0"
            echo "$(date '+%H:%M:%S') LAN监听已禁用" | logger -t lan-supervisor
            stop_worker'''
          new = '''            echo "$(date '+%H:%M:%S') LAN监听已禁用，仅停止插拔事件监听，不关闭LAN接口" | logger -t lan-supervisor'''
          if old not in s: raise SystemExit('LAN监听关闭代码未找到')
          s = s.replace(old, new, 1)
          start = s.find('    # 设备发现开关只控制发现功能，不停止LAN工作进程、不影响LAN接口和DHCP。')
          if start < 0:
              start = s.find('    # 设备发现开关独立于LAN插拔。无需重新插拔网线即可立即停止或恢复发现。')
          end = s.find('    sync_runtime_status "$iface"', start)
          if start < 0 or end < 0: raise SystemExit('设备发现supervisor代码未找到')
          s = s[:start] + '    # 设备发现开关由工作进程独立控制，supervisor只负责LAN物理插拔监听。\n\n' + s[end:]
          s = s.replace('last_discover="-1"\n', '', 2)
          s = s.replace('    discover_enable="$(cfg lan_discovery_discover_enable 1)"\n', '', 1)
          supervisor.write_text(s, encoding='utf-8')

          page = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          s = page.read_text(encoding='utf-8')
          s = s.replace('<tr><th>ARP/IP</th>', '<tr><th>ARP</th>', 1)
          hidden = '<input type="hidden" name="lan_discovery_custom" id="lan_discovery_custom" value="">'
          s = s.replace(hidden, '', 1)
          marker = '<h4>已发现设备</h4>'
          if marker not in s: raise SystemExit('设备列表位置未找到')
          ui = '<h4>自定义接口</h4><div class="alert alert-info" style="margin:8px 0">格式：名称|目标地址|端口|探测内容|启用(1/0)，每行一个。探测内容中的空格请写为%20，竖线请写为%7C。</div><textarea name="lan_discovery_custom" id="lan_discovery_custom" class="span9" rows="6"><% nvram_get_x("", "lan_discovery_custom"); %></textarea>'
          s = s.replace(marker, ui + marker, 1)
          page.write_text(s, encoding='utf-8')
          PY
          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh
          sh -n trunk/user/lan_autodiscover/lan_discovery_supervisor.sh
          git diff --check
      - name: 提交修复
        shell: bash
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add trunk/user/camdiscover/camdiscover.c trunk/user/lan_autodiscover/lan_autodiscover.sh trunk/user/lan_autodiscover/lan_discovery_supervisor.sh trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          git commit -m '修复LAN发现协议开关、周期与自定义接口'
          git push
