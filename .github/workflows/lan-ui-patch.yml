name: LAN UI patch

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/lan-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: 修补LAN监听页面
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2
      - name: 执行页面修补
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          page = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          script = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = page.read_text(encoding='utf-8')
          replacements = [
              ('<title><#Web_Title#> - 局域网自动发现</title>', '<title><#Web_Title#> - LAN监听与设备发现</title>'),
              ("function norm(v){return String(v||'').replace(/\\r/g,'').replace(/&#13;/g,'').replace(/&#10;/g,'\\n').replace(/&#8232;/g,'\\u2028').replace(/&#x2028;/gi,'\\u2028');}", "function norm(v){var s=String(v||'').replace(/\\r/g,'');for(var i=0;i<3;i++){s=s.replace(/&amp;#38;/gi,'&#38;').replace(/&amp;#10;/gi,'&#10;').replace(/&amp;#13;/gi,'&#13;').replace(/&amp;#8232;/gi,'&#8232;').replace(/&amp;#x2028;/gi,'&#x2028;');}return s.replace(/(?:&amp;|&#38;)#13;/gi,'').replace(/(?:&amp;|&#38;)#10;/gi,'\\n').replace(/(?:&amp;|&#38;)#8232;/gi,'\\u2028').replace(/(?:&amp;|&#38;)#x2028;/gi,'\\u2028').replace(/&#13;/g,'').replace(/&#10;/g,'\\n').replace(/&#8232;/g,'\\u2028').replace(/&#x2028;/gi,'\\u2028');}"),
              ("function value_or(v,d){return(v!==undefined&&v!==null&&String(v)!==''&&String(v)!=='-')?String(v):d;}\n", "function value_or(v,d){return(v!==undefined&&v!==null&&String(v)!==''&&String(v)!=='-')?String(v):d;}\nfunction link_text(v){v=String(v||'');return v==='UP'?'已插入':(v==='DOWN'?'未插入':v||'-');}\n"),
              ("$j('#status_link').text(o.link);", "$j('#status_link').text(link_text(o.link));"),
              ("opt.text=f[0]+' | '+f[1]+' | '+(f[2]||'-')+' | '+(f[4]||'-');", "opt.text=f[0]+' | '+f[1]+' | '+(f[2]||'-')+' | '+link_text(f[4]);"),
              ('<div class="box well grad_colour_dark_blue"><h2 class="box_head round_top">局域网自动发现</h2>', '<div class="box well grad_colour_dark_blue"><h2 class="box_head round_top">LAN监听与设备发现</h2>'),
              ('<div class="alert alert-info" style="margin:10px">LAN状态、上级DHCP和设备发现由后端程序提供；页面只负责配置和显示。</div>', '<div class="alert alert-info" style="margin:10px">LAN口插拔、上级DHCP和设备发现由后端程序实时监听；页面负责配置和显示。</div>'),
              ('<tr><td>检测接口</td><td id="status_iface">-</td><td>IPv4</td><td id="status_ip">-</td></tr><tr><td>MAC</td><td id="status_mac">-</td><td>Link</td><td id="status_link">-</td></tr>', '<tr><td>检测接口</td><td id="status_iface">-</td><td>LAN IPv4</td><td id="status_ip">-</td></tr><tr><td>LAN MAC</td><td id="status_mac">-</td><td>LAN口状态</td><td id="status_link">-</td></tr>'),
              ('<tr><th>LAN自动发现</th>', '<tr><th>LAN监听</th>'),
              ('<h4>实时发现日志 <button type="button" class="btn btn-mini pull-right" onclick="clearLog();return false;">清空</button></h4>', '<h4>实时监听日志 <button type="button" class="btn btn-mini pull-right" onclick="clearLog();return false;">清空日志</button></h4>')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('页面补丁未找到目标：' + old[:80])
              s = s.replace(old, new, 1)
          page.write_text(s, encoding='utf-8')

          t = script.read_text(encoding='utf-8')
          old = 'log_line "LAN Link UP $iface"'
          new = 'log_line "LAN口已插入 $iface"'
          if old not in t:
              raise SystemExit('未找到LAN插入日志记录')
          t = t.replace(old, new, 1)
          if 'log_line "LAN Link DOWN $iface"' in t:
              t = t.replace('log_line "LAN Link DOWN $iface"', 'log_line "LAN口已拔出 $iface"')
          script.write_text(t, encoding='utf-8')

          subprocess.run(['git', 'config', 'user.name', '671792320'], check=True)
          subprocess.run(['git', 'config', 'user.email', '10532894+671792320@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', str(page), str(script)])
          subprocess.run(['git', 'commit', '-m', '修复LAN监听页面实时日志显示'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/lan-ui-patch.yml'], check=True)
          subprocess.run(['git', 'commit', '-m', '删除临时LAN页面修补工作流'], check=True)
          subprocess.run(['git', 'push', 'origin', 'master'], check=True)
          PY
