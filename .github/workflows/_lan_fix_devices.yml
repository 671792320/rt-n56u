name: 修复LAN设备列表与发现状态
on:
  push:
    branches: [ master ]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != '修复LAN设备列表与发现状态'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 修改LAN程序与WebUI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = worker.read_text(encoding='utf-8')
          old = '''            # 只有物理链路从断开变为插入时清空旧网络的设备记录。\n            reset_device_db\n            run_discovery "$iface"'''
          new = '''            # 网线插拔不清空设备列表；设备列表仅在/tmp生命周期结束时自然清空，或由WebUI手动清空。\n            sync_device_cache\n            run_discovery "$iface"'''
          if old not in s:
              raise SystemExit('未找到设备列表自动清空代码')
          s = s.replace(old, new, 1)
          worker.write_text(s, encoding='utf-8')

          supervisor = Path('trunk/user/lan_autodiscover/lan_discovery_supervisor.sh')
          s = supervisor.read_text(encoding='utf-8')
          marker = 'LOG_FILE=/tmp/lan_discovery.log\n\nnv()'
          if marker in s and 'RUNTIME_DIR=/tmp/lan_discovery_runtime' not in s:
              s = s.replace(marker, 'LOG_FILE=/tmp/lan_discovery.log\nRUNTIME_DIR=/tmp/lan_discovery_runtime\nmkdir -p "$RUNTIME_DIR"\n\nnv()', 1)
          old = '''    if ps 2>/dev/null | grep -q '[c]amdiscover'; then\n        runtime_set lan_discovery_status_state="持续设备发现"\n    elif ps 2>/dev/null | grep -q '[d]hcpdetect'; then'''
          new = '''    # 功能开关优先于进程瞬时状态，避免关闭设备发现后仍显示“持续设备发现”。\n    if [ "$(cfg lan_discovery_discover_enable 1)" != "1" ]; then\n        runtime_set lan_discovery_status_state="设备发现未启用"\n    elif ps 2>/dev/null | grep -q '[c]amdiscover'; then\n        runtime_set lan_discovery_status_state="持续设备发现"\n    elif ps 2>/dev/null | grep -q '[d]hcpdetect'; then'''
          if old not in s:
              raise SystemExit('未找到发现状态判断代码')
          s = s.replace(old, new, 1)
          supervisor.write_text(s, encoding='utf-8')

          webex = Path('trunk/user/httpd/web_ex.c')
          s = webex.read_text(encoding='utf-8')
          old = '''\tif (strncmp(name, "lan_discovery_status_", 21) == 0 ||\n\t    strcmp(name, "lan_discovery_log") == 0 ||\n\t    strcmp(name, "lan_discovery_devices") == 0 ||\n\t    strcmp(name, "lan_discovery_interfaces") == 0) {\n\t\tchar path[128];'''
          new = '''\tif (strcmp(name, "lan_discovery_devices") == 0) {\n\t\tFILE *fp = fopen("/tmp/lan_discovery_devices.txt", "r");\n\t\tint ch;\n\t\tif (!fp) return 0;\n\t\twhile ((ch = fgetc(fp)) != EOF) {\n\t\t\tif (ch < 0 || (ch >= 0x20 && ch != '\"' && ch != '&' && ch != '<' && ch != '>'))\n\t\t\t\tret += fprintf(wp, "%c", ch);\n\t\t\telse\n\t\t\t\tret += fprintf(wp, "&#%d;", ch);\n\t\t}\n\t\tfclose(fp);\n\t\tfflush(wp);\n\t\treturn ret;\n\t}\n\n\tif (strncmp(name, "lan_discovery_status_", 21) == 0 ||\n\t    strcmp(name, "lan_discovery_log") == 0 ||\n\t    strcmp(name, "lan_discovery_interfaces") == 0) {\n\t\tchar path[128];'''
          if old not in s:
              raise SystemExit('未找到WebUI运行数据读取代码')
          s = s.replace(old, new, 1)
          webex.write_text(s, encoding='utf-8')
          PY
          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh
          sh -n trunk/user/lan_autodiscover/lan_discovery_supervisor.sh
          git diff --check
      - name: 提交正式源码
        shell: bash
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add trunk/user/lan_autodiscover/lan_autodiscover.sh trunk/user/lan_autodiscover/lan_discovery_supervisor.sh trunk/user/httpd/web_ex.c .github/workflows/_lan_fix_devices.yml
          git commit -m '修复LAN设备列表与发现状态'
          git rm .github/workflows/_lan_fix_devices.yml
          git commit --amend --no-edit
          git push
