name: LAN监听修复

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出主线
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: 修改LAN监听程序和Q7版本流程
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          sh = Path('trunk/user/lan_autodiscover/lan_autodiscover.sh')
          s = sh.read_text()

          if 'DEVICE_DB=/etc/storage/lan_discovery_devices.db' not in s:
              s = s.replace(
                  "trap 'rmdir \"$LOCKDIR\" 2>/dev/null' EXIT INT TERM HUP\n",
                  "trap 'rmdir \"$LOCKDIR\" 2>/dev/null' EXIT INT TERM HUP\n\n# LAN监听结果使用持久化文件保存，避免大量内容占用NVRAM。\nDEVICE_DB=/etc/storage/lan_discovery_devices.db\nLOG_FILE=/etc/storage/lan_discovery.log\nmkdir -p /etc/storage\ntouch \"$DEVICE_DB\" \"$LOG_FILE\"\n"
              )

          s = re.sub(
              r"ensure_defaults\(\) \{.*?\n\}",
              '''ensure_defaults() {
              [ -n "$(nv lan_discovery_enable)" ] || nvram set lan_discovery_enable=1
              [ -n "$(nv lan_discovery_ifname)" ] || nvram set lan_discovery_ifname=eth2.1
              [ -n "$(nv lan_discovery_dhcp_enable)" ] || nvram set lan_discovery_dhcp_enable=1
              [ -n "$(nv lan_discovery_dhcp_timeout)" ] || nvram set lan_discovery_dhcp_timeout=3
              [ -n "$(nv lan_discovery_discover_enable)" ] || nvram set lan_discovery_discover_enable=1
              [ -n "$(nv lan_discovery_cycle)" ] || nvram set lan_discovery_cycle=10
              [ -n "$(nv lan_discovery_onvif)" ] || nvram set lan_discovery_onvif=1
              [ -n "$(nv lan_discovery_onvif_port)" ] || nvram set lan_discovery_onvif_port=3702
              [ -n "$(nv lan_discovery_ssdp)" ] || nvram set lan_discovery_ssdp=1
              [ -n "$(nv lan_discovery_ssdp_port)" ] || nvram set lan_discovery_ssdp_port=1900
              [ -n "$(nv lan_discovery_hik)" ] || nvram set lan_discovery_hik=1
              [ -n "$(nv lan_discovery_hik_port)" ] || nvram set lan_discovery_hik_port=37020
              [ -n "$(nv lan_discovery_dahua)" ] || nvram set lan_discovery_dahua=1
              [ -n "$(nv lan_discovery_dahua_port)" ] || nvram set lan_discovery_dahua_port=37810
              [ -n "$(nv lan_discovery_raw)" ] || nvram set lan_discovery_raw=1
              [ -n "$(nv lan_discovery_status_dhcp)" ] || nvram set lan_discovery_status_dhcp="未检测"
              [ -n "$(nv lan_discovery_status_state)" ] || nvram set lan_discovery_status_state="空闲"
              [ -n "$(nv lan_discovery_status_count)" ] || nvram set lan_discovery_status_count=0
              [ -n "$(nv lan_discovery_status_last)" ] || nvram set lan_discovery_status_last="-"
              }''', s, count=1, flags=re.S)

          s = re.sub(
              r"log_line\(\) \{.*?\n\}",
              '''log_line() {
              line="$(sanitize_text "$(now) $*")"
              printf '%s\\n' "$line" >> "$LOG_FILE"
              tail -n 200 "$LOG_FILE" > "${LOG_FILE}.tmp" 2>/dev/null && mv -f "${LOG_FILE}.tmp" "$LOG_FILE"
              # 页面只保留最近30行，避免NVRAM溢出；完整日志保存在持久化文件中。
              recent="$(tail -n 30 "$LOG_FILE" 2>/dev/null)"
              nvram set lan_discovery_log "$recent"
              nvram set lan_discovery_status_last "$(now)"
              logger -t lan-autodiscover "$(sanitize_text "$*")"
              }''', s, count=1, flags=re.S)

          insert_helpers = '''
          sort_device_db() {
              [ -f "$DEVICE_DB" ] || return
              tmp="${DEVICE_DB}.tmp"
              : > "$tmp"
              while IFS= read -r row; do
                  [ -n "$row" ] || continue
                  ip="$(printf '%s\\n' "$row" | sed -n 's/.* IP=\\([^ ]*\\).*/\\1/p')"
                  key="$(printf '%s\\n' "$ip" | awk -F. 'NF==4 {printf "%03d%03d%03d%03d",$1,$2,$3,$4}')"
                  [ -n "$key" ] || key=999999999999
                  printf '%s|%s\\n' "$key" "$row"
              done < "$DEVICE_DB" | sort -n | cut -d'|' -f2- > "$tmp"
              mv -f "$tmp" "$DEVICE_DB"
              tail -n 100 "$DEVICE_DB" > "${DEVICE_DB}.tmp" 2>/dev/null && mv -f "${DEVICE_DB}.tmp" "$DEVICE_DB"
          }
          sync_device_cache() {
              sort_device_db
              nvram set lan_discovery_devices "$(tail -n 40 "$DEVICE_DB" 2>/dev/null)"
              count="$(wc -l < "$DEVICE_DB" 2>/dev/null | tr -d ' ')"
              nvram set lan_discovery_status_count "${count:-0}"
          }
          '''
          if 'sort_device_db() {' not in s:
              s = s.replace('\nappend_device() {', insert_helpers + '\nappend_device() {', 1)

          s = re.sub(
              r"append_device\(\) \{.*?\n\}",
              '''append_device() {
              line="$(sanitize_text "$1")"; [ -n "$line" ] || return
              line="$(printf '%s' "$line" | sed 's/\\\\//g')"
              mac="$(printf '%s\\n' "$line" | sed -n 's/.* MAC=//p' | awk '{print $1}')"
              if [ -n "$mac" ]; then
                  mac="$(sanitize_mac "$mac")"
                  line="$(printf '%s\\n' "$line" | sed "s/ MAC=[^ ]*/ MAC=$mac/")"
              fi
              ip="$(printf '%s\\n' "$line" | sed -n 's/.* IP=\\([^ ]*\\).*/\\1/p')"
              [ -n "$ip" ] || return
              tmp="${DEVICE_DB}.tmp"
              : > "$tmp"
              awk -v ip="$ip" 'index($0," IP=" ip " ")==0 && index($0," IP=" ip)==0 {print}' "$DEVICE_DB" 2>/dev/null >> "$tmp"
              printf '%s\\n' "$line" >> "$tmp"
              mv -f "$tmp" "$DEVICE_DB"
              sync_device_cache
              }''', s, count=1, flags=re.S)

          s = s.replace(
              'nvram set lan_discovery_devices=""; nvram set lan_discovery_status_count="0"; nvram set lan_discovery_status_state="持续设备发现";',
              ': > "$DEVICE_DB"; sync_device_cache; nvram set lan_discovery_status_state="持续设备发现";',
              1
          )
          s = s.replace(
              'DEVICE\\ *) append_device "$line"; log_line "$line";;',
              'DEVICE\\ *) append_device "$line"; line="$(printf \'%s\' "$line" | sed \'s/\\\\\\\\//g\')"; log_line "$line";;',
              1
          )
          sh.write_text(s)

          asp = Path('trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp')
          a = asp.read_text()
          a = a.replace(
              "var refresh_timer=null;",
              "var refresh_timer=null;var device_rows=[];var device_page=1;",
              1
          )
          a = re.sub(
              r"function render_devices\(s\)\{.*?\n\}
function render_log",
              '''function render_devices(s){
              var body=document.getElementById('devices');if(!body)return;
              var ls=lines(s),byIp={},rows=[];
              for(var i=0;i<ls.length;i++){
               var z=ls[i];if(z.indexOf('DEVICE ')!==0)continue;
               var type=(z.match(/type=([^ ]+)/)||[])[1]||'-';
               var ip=(z.match(/IP=([^ ]+)/)||[])[1]||'-';
               var mac=mac_norm((z.match(/MAC=([^ ]+)/)||[])[1]||'-');
               var info=(z.match(/INFO=(.*)$/)||[])[1]||'-';
               if(byIp[ip]){
                var r=byIp[ip];if(type!=='-'&&r.type.indexOf(type)<0)r.type=r.type==='-'?type:r.type+'/'+type;
                if(r.mac==='-'&&mac!=='-')r.mac=mac;if((r.info==='-'||!r.info)&&info!=='-')r.info=info;
               }else{var row={type:type,ip:ip,mac:mac,info:info};byIp[ip]=row;rows.push(row);}
              }
              rows.sort(function(a,b){function k(ip){var p=ip.split('.');return p.length===4?(((+p[0])*256+(+p[1]))*256+(+p[2]))*256+(+p[3]):4294967295;}return k(a.ip)-k(b.ip);});
              device_rows=rows;var pages=Math.max(1,Math.ceil(rows.length/5));if(device_page>pages)device_page=pages;
              body.innerHTML='';var start=(device_page-1)*5,end=Math.min(start+5,rows.length);
              for(var j=start;j<end;j++){var r=rows[j],tr=document.createElement('tr');var cells=[];for(var c=0;c<5;c++){cells[c]=document.createElement('td');tr.appendChild(cells[c]);}cells[0].textContent=(j+1);cells[1].textContent=r.type;cells[2].textContent=r.ip;cells[3].textContent=r.mac;cells[4].textContent=r.info;body.appendChild(tr);}
              if(!body.children.length)body.innerHTML='<tr><td colspan="5" class="muted">暂无设备</td></tr>';
              var pager=document.getElementById('device_pager');if(pager){pager.innerHTML='';if(rows.length){var info=document.createElement('span');info.className='muted';info.innerHTML='第 '+device_page+' / '+pages+' 页，共 '+rows.length+' 台';pager.appendChild(info);var prev=document.createElement('button');prev.type='button';prev.className='btn btn-small';prev.style.marginLeft='8px';prev.disabled=device_page<=1;prev.innerHTML='上一页';prev.onclick=function(){if(device_page>1){device_page--;render_devices(s);}};pager.appendChild(prev);var next=document.createElement('button');next.type='button';next.className='btn btn-small';next.style.marginLeft='4px';next.disabled=device_page>=pages;next.innerHTML='下一页';next.onclick=function(){if(device_page<pages){device_page++;render_devices(s);}};pager.appendChild(next);}}
              }
function render_log''', a, count=1, flags=re.S)
          if '<tbody id="devices"></tbody>' in a and 'id="device_pager"' not in a:
              a = re.sub(r'(<tbody id="devices"></tbody>\s*</table>)', r'\1<div id="device_pager" style="padding:6px 0;text-align:right"></div>', a, count=1)
          a = a.replace(
              '.live-box{height:170px;',
              '.live-box{height:220px;',
              1
          )
          asp.write_text(a)

          wf = Path('.github/workflows/q7-build.yml')
          w = wf.read_text()
          old = '''          python3 - <<PY
          from pathlib import Path

          p = Path('trunk/user/rc/rc.c')
          s = p.read_text()
          marker = '\\tklogctl(8, NULL, nvram_get_int("console_loglevel"));'
          version_line = f'\\tnvram_set("firmver_sub", "${VERSION_STRING}");\\n'
          if s.count(version_line) != 0:
              raise SystemExit('Q7固件版本初始化已经存在')
          if marker not in s:
              raise SystemExit('没有找到固件版本初始化插入位置')
          s = s.replace(marker, version_line + marker, 1)
          p.write_text(s)
          print('已写入Q7固件版本初始化：${VERSION_STRING}')
          PY

          grep -n 'nvram_set("firmver_sub"' trunk/user/rc/rc.c
          test "$(grep -c 'nvram_set("firmver_sub"' trunk/user/rc/rc.c)" -eq 1
'''
          new = '''          python3 - <<PY
          from pathlib import Path
          import re

          p = Path('trunk/user/rc/rc.c')
          s = p.read_text()
          s = re.sub(r'\\n#ifdef Q7_FIRMWARE_VERSION.*?#endif\\n', '\\n', s, flags=re.S)
          s = re.sub(r'\\n\\s*nvram_set\\("firmver_sub", "[^"]*"\\);\\n', '\\n', s)
          marker = '\\t// system ready'
          version_line = f'\\tnvram_set("firmver_sub", "${VERSION_STRING}");\\n'
          if marker not in s:
              raise SystemExit('没有找到系统就绪位置')
          s = s.replace(marker, version_line + marker, 1)
          p.write_text(s)
          print('已在系统就绪阶段写入Q7固件版本：${VERSION_STRING}')
          PY

          grep -n 'nvram_set("firmver_sub"' trunk/user/rc/rc.c
          test "$(grep -c 'nvram_set("firmver_sub"' trunk/user/rc/rc.c)" -eq 1
'''
          if old not in w:
              raise SystemExit('Q7版本注入代码块未找到')
          w = w.replace(old, new, 1)
          wf.write_text(w)
          PY

          sh -n trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'DEVICE_DB=/etc/storage/lan_discovery_devices.db' trunk/user/lan_autodiscover/lan_autodiscover.sh
          grep -q 'device_pager' trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp
          grep -q '系统就绪' .github/workflows/q7-build.yml || grep -q 'system ready' .github/workflows/q7-build.yml

      - name: 提交修复
        shell: bash
        run: |
          set -e
          git config user.name "671792320"
          git config user.email "10532894+671792320@users.noreply.github.com"
          git add trunk/user/lan_autodiscover/lan_autodiscover.sh trunk/user/www/n56u_ribbon_fixed/Advanced_LANDiscover_Content.asp .github/workflows/q7-build.yml
          git diff --cached --quiet && { echo "没有需要提交的修改"; exit 0; }
          git commit -m "修复LAN日志设备持久化和Q7版本显示"
          git push origin master
          git status --short

      - name: 删除一次性修复工作流
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "671792320"
          git config user.email "10532894+671792320@users.noreply.github.com"
          git rm .github/workflows/patch_lan_monitor.yml
          git commit -m "删除一次性LAN修复工作流"
          git push origin master
