name: Restore Q7 build files

on:
  push:
    branches: [feature/q7-smart-lan-discovery]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[q7-files-restored]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original build files and enable generic tools
        run: |
          git show 232f64952c045baf0b2e53fe1dd1f75d1e118d92:trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config > trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          if ! grep -q '^# CONFIG_SHORTCUT_FE is not set$' trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config; then
            printf '\n# CONFIG_SHORTCUT_FE is not set\n' >> trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          fi
          git show 232f64952c045baf0b2e53fe1dd1f75d1e118d92:trunk/user/Makefile > trunk/user/Makefile
          sed -i 's/dir_y[[:space:]]*+=[[:space:]]*q7netmgr/dir_y += netmgr/' trunk/user/Makefile
          grep -q 'dir_y.*+= camdiscover' trunk/user/Makefile
          grep -q 'dir_y.*+= netmgr' trunk/user/Makefile
          test -s trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config
          test -s trunk/user/Makefile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trunk/configs/boards/ZTE_Q7/kernel-3.4.x.config trunk/user/Makefile
          if git diff --cached --quiet; then
            echo 'Q7 build files already restored.'
          else
            git commit -m 'fix: restore Q7 build files [q7-files-restored]'
            git push origin HEAD:feature/q7-smart-lan-discovery
          fi
